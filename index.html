<!doctype html>
<html lang="bn">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VISION Admin Control Center — Database Manager</title>
  <meta name="robots" content="noindex,nofollow">
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Baloo+Da+2:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --i: #17233f;
      --m: #68748d;
      --p: #f5f7fb;
      --w: #fff;
      --l: #e4e8ef;
      --g: #e8a33d;
      --r: #d9534f;
      --ok: #20875a
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--p);
      color: var(--i);
      font-family: 'Anek Bangla', sans-serif
    }

    button,
    input,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .hidden {
      display: none !important
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px
    }

    .box,
    .panel,
    .stat {
      background: #fff;
      border: 1px solid var(--l);
      border-radius: 16px;
      box-shadow: 0 14px 40px #17233f12
    }

    .box {
      width: min(430px, 100%);
      padding: 32px
    }

    .brand {
      font: 800 28px 'Baloo Da 2'
    }

    .brand span {
      color: var(--g)
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin: 12px 0 5px
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--l);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800
    }

    .primary {
      background: var(--i);
      color: #fff
    }

    .gold {
      background: var(--g);
      color: var(--i)
    }

    .ghost {
      background: #fff;
      border: 1px solid var(--l)
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 245px 1fr
    }

    .side {
      background: #101a31;
      color: #fff;
      padding: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto
    }

    .side nav button {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: #cbd3e5;
      text-align: left;
      padding: 10px 12px;
      border-radius: 9px;
      margin: 3px 0
    }

    .side nav button:hover,
    .side nav button.active {
      background: #263657;
      color: #fff
    }

    .muted {
      color: var(--m)
    }

    .main {
      min-width: 0
    }

    .top {
      height: 68px;
      background: #fff;
      border-bottom: 1px solid var(--l);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 5
    }

    .content {
      padding: 22px;
      max-width: 1700px;
      margin: auto
    }

    .title {
      font: 800 30px 'Baloo Da 2';
      margin: 0
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px
    }

    .stat {
      padding: 17px;
      text-align: left
    }

    .stat .n {
      font-size: 28px;
      font-weight: 800
    }

    .panel {
      overflow: hidden;
      margin-top: 16px
    }

    .ph {
      padding: 14px 16px;
      border-bottom: 1px solid var(--l);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap
    }

    .tools,
    .act {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .tools input {
      width: 240px
    }

    .tw {
      overflow: auto
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px
    }

    .tbl th,
    .tbl td {
      padding: 7px 9px;
      border-bottom: 1px solid #edf0f4;
      text-align: left;
      font-size: 13px;
      vertical-align: middle
    }

    .tbl td {
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tbl td:nth-child(1) {
      max-width: 90px
    }

    .tbl td:nth-child(2) {
      max-width: 170px
    }

    .tbl td:nth-child(3) {
      max-width: 90px
    }

    .tbl td:nth-child(4) {
      max-width: 55px;
      width: 55px
    }

    .tbl td:nth-child(5),
    .tbl td:nth-child(6) {
      max-width: 150px
    }

    .tbl td:nth-child(7),
    .tbl td:nth-child(8) {
      max-width: 90px;
      width: 90px
    }

    .tbl td:nth-child(9) {
      max-width: 110px
    }

    .tbl td:nth-child(10) {
      max-width: 180px
    }

    .tbl th:nth-child(4) {
      width: 55px
    }

    .tbl th:nth-child(10) {
      min-width: 150px
    }

    .compact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #eef5ff;
      color: #1769df;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800
    }

    .compact-link:hover {
      background: #dfeeff
    }

    .tbl .actions-cell {
      vertical-align: middle
    }

    .tbl th {
      background: #fafbfc
    }

    .mini {
      border: 1px solid var(--l);
      background: #fff;
      border-radius: 8px;
      padding: 5px 8px;
      font-weight: 700
    }

    .mini.ok {
      background: #eaf8f0;
      color: var(--ok)
    }

    .mini.bad {
      background: #fff0ef;
      color: var(--r)
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--m)
    }

    .pager {
      padding: 11px 15px;
      display: flex;
      justify-content: space-between
    }

    .drawer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: flex-end;
      z-index: 45;
      animation: modalFade .2s ease-out
    }

    .drawer>div {
      width: min(680px, 100%);
      height: 100%;
      overflow: auto;
      background: #fff;
      padding: 26px 28px;
      box-shadow: -10px 0 40px rgba(15, 23, 42, .22);
      display: flex;
      flex-direction: column
    }

    .drawer-inner {
      display: flex;
      flex-direction: column;
      min-height: 100%
    }

    .drawer form {
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .drawer label {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      margin: 0 0 5px
    }

    .drawer input:not([type="checkbox"]):not([type="radio"]),
    .drawer textarea,
    .drawer select {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      transition: all .2s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .04)
    }

    .drawer input:not([type="checkbox"]):not([type="radio"]):hover,
    .drawer textarea:hover,
    .drawer select:hover {
      border-color: #94a3b8;
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .06)
    }

    .drawer input:not([type="checkbox"]):not([type="radio"]):focus,
    .drawer textarea:focus,
    .drawer select:focus {
      border-color: #3b82f6;
      background-color: #fff;
      box-shadow: 0 0 0 3.5px rgba(59, 130, 246, .18);
      outline: none
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .full {
      grid-column: 1/-1
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: var(--i);
      color: #fff;
      padding: 10px 14px;
      border-radius: 9px;
      z-index: 30
    }

    @media(max-width:1000px) {
      .cards {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:760px) {
      .app {
        grid-template-columns: 1fr
      }

      .side {
        height: auto;
        position: relative
      }

      .side nav {
        display: flex;
        overflow: auto
      }

      .side nav button {
        min-width: max-content
      }

      .content {
        padding: 14px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .full {
        grid-column: auto
      }
    }

    @media(max-width:520px) {
      .cards {
        grid-template-columns: 1fr
      }
    }

    .small {
      font-size: 12px
    }

    .secret {
      letter-spacing: 2px;
      color: #8b94a8
    }

    .cell-link {
      color: #1c63d5;
      text-decoration: none;
      font-weight: 600
    }

    .cell-link:hover {
      text-decoration: underline
    }

    .badge {
      display: inline-flex;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #f1f3f6;
      color: #68748d
    }

    .badge.on {
      background: #eaf8f0;
      color: #20875a
    }

    .badge.off {
      background: #fff0ef;
      color: #d9534f
    }

    .tbl th {
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap
    }

    .tbl td {
      line-height: 1.25
    }

    .actions-head,
    .actions-cell {
      min-width: 190px;
      position: sticky;
      right: 0;
      background: #fff;
      z-index: 3
    }

    .tbl th.actions-head {
      background: #fafbfc
    }

    .act {
      min-width: 180px
    }

    .mini:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .error-box {
      color: #d9534f;
      background: #fff8f8;
      border: 1px solid #ffd6d3;
      margin: 16px;
      border-radius: 12px
    }

    .drawer select {
      width: 100%;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 14px;
      background-color: #f8fafc
    }

    .status-spinner {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      padding: 14px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--l);
      background-color: #fff;
      background-repeat: no-repeat !important;
      background-position: right 14px center !important;
      background-size: 14px 14px !important;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2368748d" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
      cursor: pointer
    }

    .status-spinner[data-val="Pending"] {
      color: #a06b00;
      background-color: #fff6e0;
      border-color: #f0d38a
    }

    .status-spinner[data-val="Active"] {
      color: #0a7a3d;
      background-color: #e6f7ee;
      border-color: #8fd6ae
    }

    .status-spinner[data-val="Expired"] {
      color: #a3271c;
      background-color: #fdeceb;
      border-color: #f0a89f
    }

    .access-spinner {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 36px 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background-color: #fff;
      background-repeat: no-repeat !important;
      background-position: right 14px center !important;
      background-size: 14px 14px !important;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>');
      color: #0f172a;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .04)
    }

    .access-spinner:hover {
      border-color: #94a3b8
    }

    .access-spinner:focus {
      border-color: #3b82f6;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
      outline: none
    }

    .access-spinner[data-val="Limited Access"] {
      background-color: #fffbeb !important;
      border-color: #fcd34d !important;
      color: #b45309 !important;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23b45309" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>') !important
    }

    .access-spinner[data-val="Full Access"] {
      background-color: #ecfdf5 !important;
      border-color: #86efac !important;
      color: #047857 !important;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23047857" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>') !important
    }

    .adm-enroll-date-input {
      width: 100%;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      cursor: pointer !important;
      transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 3px rgba(15, 23, 42, .04)
    }

    .adm-enroll-date-input:hover {
      border-color: #3b82f6;
      background-color: #fff;
      box-shadow: 0 3px 12px rgba(59, 130, 246, .12);
      transform: translateY(-0.5px)
    }

    .adm-enroll-date-input:focus {
      border-color: #2563eb;
      background-color: #fff;
      box-shadow: 0 0 0 3.5px rgba(59, 130, 246, .18);
      outline: none
    }

    .adm-enroll-date-input::-webkit-calendar-picker-indicator {
      cursor: pointer !important;
      padding: 5px 7px;
      margin-right: -2px;
      border-radius: 7px;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      transition: all .18s ease;
      pointer-events: none;
    }

    .adm-enroll-date-input:hover::-webkit-calendar-picker-indicator {
      background-color: #dbeafe;
      border-color: #93c5fd;
      transform: scale(1.08)
    }

    /* Custom DatePicker Modal */
    .cdp-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: cdpFadeIn .18s ease-out;
    }

    @keyframes cdpFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .cdp-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.28), 0 0 0 1px rgba(226, 232, 240, 0.9);
      width: 100%;
      max-width: 325px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: inherit;
      user-select: none;
    }

    .cdp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cdp-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .cdp-select {
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 5px 8px;
      cursor: pointer;
      outline: none;
      transition: all .15s ease;
    }

    .cdp-select:hover, .cdp-select:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .cdp-nav-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: all .15s ease;
    }

    .cdp-nav-btn:hover {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .cdp-close-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .cdp-close-btn:hover {
      background: #fee2e2;
      color: #b91c1c;
    }

    .cdp-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11.5px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 1px solid #f1f5f9;
    }

    .cdp-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cdp-day {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all .15s ease;
      position: relative;
    }

    .cdp-day.other-month {
      color: #cbd5e1;
    }

    .cdp-day:hover:not(.empty) {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .cdp-day.today::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #2563eb;
    }

    .cdp-day.selected {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%) !important;
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .cdp-day.selected::after {
      background: #ffffff;
    }

    .cdp-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      gap: 10px;
    }

    .cdp-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .cdp-btn.ghost {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #475569;
    }

    .cdp-btn.ghost:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .cdp-btn.primary {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
      border: 1px solid #1d4ed8;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
      min-width: 70px;
    }

    .cdp-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .adm-enroll-num-input {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      transition: all .2s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .04)
    }

    .adm-enroll-num-input:hover {
      border-color: #94a3b8;
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .06)
    }

    .adm-enroll-num-input:focus {
      border-color: #3b82f6;
      background-color: #fff;
      box-shadow: 0 0 0 3.5px rgba(59, 130, 246, .18);
      outline: none
    }

    /* Remove number stepper/spinner arrows */
    .adm-enroll-num-input::-webkit-outer-spin-button,
    .adm-enroll-num-input::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none !important;
      margin: 0 !important;
    }

    .adm-enroll-num-input,
    input[type="number"] {
      -moz-appearance: textfield !important;
      appearance: textfield !important;
    }

    .field-type {
      font-size: 10px;
      color: #8a94a8;
      font-weight: 600;
      margin-left: 5px
    }

    .field-note {
      font-size: 11px;
      color: #d9534f
    }

    .editor-meta {

  <script>
    const API = 'https://late-forest-4748.dreamsicreation.workers.dev/'; // Cloudflare Worker URL
    const P = { students: ['student_login', 'Students'], enrollments: ['student_enrolled', 'Enrollments'], courses: ['course_name', 'Courses'], subjects: ['subjectwise_course_name', 'Subject-wise Courses'], teachers: ['teachers', 'Teachers'], free: ['free_class', 'Free Classes'], gallery: ['gallery', 'Gallery / Reviews'], shop: ['shop_item', 'Shop Products'], orders: ['shop_orders', 'Shop Orders'] };
    let S = { token: localStorage.va_admin_token || '', user: null, table: null, cols: [], rows: [], rawEnrollRows: [], rawStudentRows: [], lastRawData: null, lastStudentRawData: null, search: '', levelFilter: '', courseFilter: '', dueFilter: '', enrolledDateFilter: '', nextDateFilter: '', pendingLevel: '', pendingSearch: '', offset: 0, limit: 50, total: 0 };
    const ENROLL_TABLE = 'student_enrolled';
    const STUDENT_TABLE = 'student_login';
    const ENROLL_EDITABLE_FIELDS = ['expires_at', 'next_date', 'paid', 'access_type'];
    function isEnrollTable() { return S.table === ENROLL_TABLE }
    function isStudentTable() { return S.table === STUDENT_TABLE }
    let searchTimer = null;
    let refreshSeq = 0;
    const pageCache = new Map();
    function cacheKey() { return S.table || '' }
    function parseNextDateToIso(val) {
      const raw = String(val || '').trim();
      if (!raw || raw === '—') return null;
      const m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(raw);
      if (m) {
        const y = m[1];
        const mo = m[2].padStart(2, '0');
        const d = m[3].padStart(2, '0');
        return `${y}-${mo}-${d}`;
      }
      const dt = new Date(raw);
      if (!isNaN(dt.getTime())) {
        const y = dt.getFullYear();
        const mo = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        return `${y}-${mo}-${d}`;
      }
      return null;
    }
    function getTodayIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function getFutureIso(days) {
      const fut = new Date();
      fut.setDate(fut.getDate() + Number(days));
      const y = fut.getFullYear();
      const m = String(fut.getMonth() + 1).padStart(2, '0');
      const d = String(fut.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function matchesDueFilter(r, filterVal) {
      if (!filterVal) return true;
      const due = dueAmount(r);
      if (filterVal === 'due') return due !== null && due > 0;
      if (filterVal === 'paid') return due !== null && due <= 0;
      return true;
    }
    function matchesNextDateFilter(r, filterVal) {
      if (!filterVal) return true;
      const raw = String(r.next_date || '').trim();
      const iso = parseNextDateToIso(raw);

      if (filterVal === 'hasDate') return !!iso;
      if (filterVal === 'noDate') return !iso;
      if (!iso) return false;

      const todayIso = getTodayIso();
      if (filterVal === 'today') return iso === todayIso;
      if (filterVal === 'next7') {
        const futIso = getFutureIso(7);
        return iso >= todayIso && iso <= futIso;
      }
      if (filterVal === 'thisMonth') return iso.slice(0, 7) === todayIso.slice(0, 7);
      if (filterVal === 'overdue') return iso < todayIso;
      if (filterVal.startsWith('date:')) return iso === filterVal.slice(5);
      return true;
    }
    function matchesEnrolledDateFilter(r, filterVal) {
      if (!filterVal) return true;
      const raw = String(r.enrolled_at || '').trim();
      const iso = parseNextDateToIso(raw);
      if (!iso) return false;

      const todayIso = getTodayIso();
      if (filterVal === 'today') return iso === todayIso;
      if (filterVal === 'last7' || filterVal === 'next7') {
        const pastIso = getFutureIso(-7);
        const futIso = getFutureIso(1);
        return iso >= pastIso && iso <= futIso;
      }
      if (filterVal === 'thisMonth') return iso.slice(0, 7) === todayIso.slice(0, 7);
      if (filterVal.startsWith('date:')) return iso === filterVal.slice(5);
      return true;
    }
    const ENROLL_LEVEL_TABS = [
      { id: '', name: 'সকল লেভেল', icon: '🌐' },
      { id: 'BBA DCU', name: 'BBA DCU', icon: '🎓' },
      { id: 'BBA NU', name: 'BBA NU', icon: '🎓' },
      { id: 'BBA Professional', name: 'BBA Professional', icon: '💼' },
      { id: 'BBS', name: 'BBS', icon: '🏛' },
      { id: 'MBA', name: 'MBA', icon: '🎖' },
      { id: 'HSC', name: 'HSC', icon: '📚' },
      { id: 'SSC', name: 'SSC', icon: '🎒' }
    ];

    function getEnrollmentRowLevel(r) {
      if (!r) return '';
      const rawLevel = String(r.level || '').trim();
      if (!rawLevel) return '';
      const lUpper = rawLevel.toUpperCase();
      if (lUpper === 'BBA DCU') return 'BBA DCU';
      if (lUpper === 'BBA NU') return 'BBA NU';
      if (lUpper.includes('PROFESSIONAL')) return 'BBA Professional';
      if (lUpper === 'BBS') return 'BBS';
      if (lUpper === 'MBA') return 'MBA';
      if (lUpper === 'HSC') return 'HSC';
      if (lUpper === 'SSC') return 'SSC';
      return rawLevel;
    }

    function renderEnrollLevelButtons() {
      return ENROLL_LEVEL_TABS.map(l => `
        <button type="button" class="cc-level-btn ${S.levelFilter === l.id ? 'active' : ''}" data-level="${esc(l.id)}" onclick="setEnrollLevel('${esc(l.id)}')">
          <span>${l.icon}</span>
          <span>${esc(l.name)}</span>
          <span class="cc-badge-count" data-level-badge="${esc(l.id)}">…</span>
        </button>
      `).join('');
    }

    function updateEnrollLevelBadges() {
      const rows = S.rawEnrollRows || [];
      // Single pass — O(N) instead of O(7×N)
      const counts = { '': rows.length };
      ENROLL_LEVEL_TABS.forEach(tab => { if (tab.id) counts[tab.id] = 0; });
      for (const r of rows) {
        const lvl = getEnrollmentRowLevel(r);
        if (counts[lvl] !== undefined) counts[lvl]++;
      }
      document.querySelectorAll('#enrollLevelBar .cc-badge-count').forEach(badge => {
        const lvl = badge.dataset.levelBadge ?? '';
        badge.textContent = counts[lvl] !== undefined ? counts[lvl] : '0';
      });
    }

    function setEnrollLevel(lvl) {
      if (S.levelFilter === lvl && lvl !== '') {
        S.levelFilter = '';
      } else {
        S.levelFilter = String(lvl || '');
      }

      document.querySelectorAll('#enrollLevelBar .cc-level-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === S.levelFilter);
      });

      populateCourseFilter(S.lastRawData?.courses || []);
      applyEnrollFiltersAndRender();
    }

    function getStudentRowLevel(r) {
      if (!r) return '';
      const rawLevel = String(r.level || '').trim();
      const rawInst = String(r.institute || '').trim().toUpperCase();

      if (rawLevel) {
        const lUpper = rawLevel.toUpperCase();
        if (lUpper === 'BBA DCU' || (lUpper.includes('BBA') && (lUpper.includes('DCU') || rawInst.includes('DCU') || rawInst.includes('7 COLLEGE') || rawInst.includes('DHAKA')))) return 'BBA DCU';
        if (lUpper === 'BBA NU' || (lUpper.includes('BBA') && (lUpper.includes('NU') || rawInst.includes('NU') || rawInst.includes('NATIONAL')))) return 'BBA NU';
        if (lUpper.includes('PROFESSIONAL')) return 'BBA Professional';
        if (lUpper === 'BBS' || lUpper.includes('BBS')) return 'BBS';
        if (lUpper === 'MBA' || lUpper.includes('MBA')) return 'MBA';
        if (lUpper === 'HSC' || lUpper.includes('HSC')) return 'HSC';
        if (lUpper === 'SSC' || lUpper.includes('SSC')) return 'SSC';
        if (lUpper === 'BBA') return 'BBA DCU';
        for (const tab of ENROLL_LEVEL_TABS) {
          if (tab.id && lUpper.includes(tab.id.toUpperCase())) return tab.id;
        }
      }
      return '';
    }

    function renderStudentLevelButtons() {
      return ENROLL_LEVEL_TABS.map(l => `
        <button type="button" class="cc-level-btn ${S.levelFilter === l.id ? 'active' : ''}" data-level="${esc(l.id)}" onclick="setStudentLevel('${esc(l.id)}')">
          <span>${l.icon}</span>
          <span>${esc(l.name)}</span>
          <span class="cc-badge-count" data-student-level-badge="${esc(l.id)}">…</span>
        </button>
      `).join('');
    }

    function updateStudentLevelBadges() {
      const rows = S.rawStudentRows || [];
      const counts = { '': rows.length };
      ENROLL_LEVEL_TABS.forEach(tab => {
        if (tab.id) {
          counts[tab.id] = rows.filter(r => getStudentRowLevel(r) === tab.id).length;
        }
      });

      document.querySelectorAll('#studentLevelBar .cc-badge-count').forEach(badge => {
        const lvl = badge.dataset.studentLevelBadge ?? '';
        badge.textContent = counts[lvl] !== undefined ? counts[lvl] : '0';
      });
    }

    function setStudentLevel(lvl) {
      if (S.levelFilter === lvl && lvl !== '') {
        S.levelFilter = '';
      } else {
        S.levelFilter = String(lvl || '');
      }

      document.querySelectorAll('#studentLevelBar .cc-level-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === S.levelFilter);
      });

      applyStudentFiltersAndRender();
    }

    function applyStudentFiltersAndRender() {
      if (!isStudentTable() || !S.lastStudentRawData) return;
      let filtered = (S.rawStudentRows || []).slice();

      if (S.levelFilter) {
        filtered = filtered.filter(r => getStudentRowLevel(r) === S.levelFilter);
      }

      const isClientFiltered = !!S.levelFilter;
      const total = isClientFiltered ? filtered.length : Number(S.lastStudentRawData?.total ?? filtered.length);
      const offset = isClientFiltered ? 0 : Number(S.lastStudentRawData?.offset ?? S.offset ?? 0);

      const filteredData = {
        ...S.lastStudentRawData,
        rows: filtered,
        total: total,
        offset: offset
      };
      S.rows = filtered;
      S.total = total;
      renderTable(filteredData);
    }

    function renderPendingLevelButtons() {
      return ENROLL_LEVEL_TABS.map(l => `
        <button type="button" class="cc-level-btn ${S.pendingLevel === l.id ? 'active' : ''}" data-level="${esc(l.id)}" onclick="setPendingLevel('${esc(l.id)}')">
          <span>${l.icon}</span>
          <span>${esc(l.name)}</span>
          <span class="cc-badge-count" data-pending-level-badge="${esc(l.id)}">…</span>
        </button>
      `).join('');
    }

    function updatePendingLevelBadges() {
      const rows = S.pendingRows || [];
      const counts = { '': rows.length };
      ENROLL_LEVEL_TABS.forEach(tab => {
        if (tab.id) {
          counts[tab.id] = rows.filter(r => getEnrollmentRowLevel(r) === tab.id).length;
        }
      });

      document.querySelectorAll('#pendingLevelBar .cc-badge-count').forEach(badge => {
        const lvl = badge.dataset.pendingLevelBadge ?? '';
        badge.textContent = counts[lvl] !== undefined ? counts[lvl] : '0';
      });
    }

    function setPendingLevel(lvl) {
      if (S.pendingLevel === lvl && lvl !== '') {
        S.pendingLevel = '';
      } else {
        S.pendingLevel = String(lvl || '');

    function formatReadableDate(v) {
      if (!v) return '';
      const raw = String(v).trim();
      if (!raw || raw === '—') return '';
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/.exec(raw);
      if (m) {
        const year = parseInt(m[1], 10);
        const month = parseInt(m[2], 10) - 1;
        const day = parseInt(m[3], 10);
        if (month >= 0 && month < 12) {
          return `${day} ${months[month]} ${year}`;
        }
      }
      const d = new Date(raw);
      if (isNaN(d.getTime())) return '';
      return `${d.getUTCDate()} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    }

    function renderCdpCalendar() {
      const grid = document.getElementById('cdpDaysGrid');
      if (!grid) return;
      const pad = n => String(n).padStart(2, '0');
      const today = new Date();
      const todayIso = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

      const firstDay = new Date(cdpCurrentYear, cdpCurrentMonth, 1).getDay();
      const daysInMonth = new Date(cdpCurrentYear, cdpCurrentMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(cdpCurrentYear, cdpCurrentMonth, 0).getDate();

      let html = '';

      for (let i = firstDay - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const prevMonth = cdpCurrentMonth === 0 ? 11 : cdpCurrentMonth - 1;
        const prevYear = cdpCurrentMonth === 0 ? cdpCurrentYear - 1 : cdpCurrentYear;
        const iso = `${prevYear}-${pad(prevMonth + 1)}-${pad(d)}`;
        const isSel = (iso === cdpSelectedIso);
        html += `<div class="cdp-day other-month ${isSel ? 'selected' : ''}" onclick="cdpPickDate('${iso}')" ondblclick="cdpPickAndConfirm('${iso}')">${d}</div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${cdpCurrentYear}-${pad(cdpCurrentMonth + 1)}-${pad(d)}`;
        const isSel = (iso === cdpSelectedIso);
        const isToday = (iso === todayIso);
        html += `<div class="cdp-day ${isSel ? 'selected' : ''} ${isToday ? 'today' : ''}" onclick="cdpPickDate('${iso}')" ondblclick="cdpPickAndConfirm('${iso}')">${d}</div>`;
      }

      const totalCells = firstDay + daysInMonth;
      const remaining = (totalCells % 7 === 0) ? 0 : (7 - (totalCells % 7));
      for (let d = 1; d <= remaining; d++) {
        const nextMonth = cdpCurrentMonth === 11 ? 0 : cdpCurrentMonth + 1;
        const nextYear = cdpCurrentMonth === 11 ? cdpCurrentYear + 1 : cdpCurrentYear;
        const iso = `${nextYear}-${pad(nextMonth + 1)}-${pad(d)}`;
        const isSel = (iso === cdpSelectedIso);
        html += `<div class="cdp-day other-month ${isSel ? 'selected' : ''}" onclick="cdpPickDate('${iso}')" ondblclick="cdpPickAndConfirm('${iso}')">${d}</div>`;
      }

      grid.innerHTML = html;
    }

      };

      const body = { action: serverAction, ...o, adminToken: S.token };
      let r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),

      });
      let j;

      if (!r.ok) {
        const msg = String(j?.message || `Worker HTTP ${r.status}`);

        throw Error(msg);
      }

    async function saveEnrollmentDirect(id) {
      const pool = isEnrollTable() ? (S.rawEnrollRows?.length ? S.rawEnrollRows : S.rows) : S.rows;
      const oldRow = (pool || []).find(x => Number(x.__rowid) === Number(id));
      if (!oldRow) {
        toast('Enrollment record not found');
        return;
      }

      const expInput = document.getElementById('eleExpiresAt');
      const nextDateInput = document.getElementById('eleNextDate');
      const accessTypeInput = document.getElementById('eleAccessType');
      const addPaidInput = document.getElementById('eleAddPaid');
      const feedbackInput = document.getElementById('eleFeedback');

      const expVal = expInput ? expInput.value.trim() : '';
      const ndVal = nextDateInput ? nextDateInput.value.trim() : '';
      const accessVal = accessTypeInput ? accessTypeInput.value : '';
      const addPaidVal = addPaidInput ? addPaidInput.value.replace(/[^\d.]/g, '').trim() : '';
      const fbText = feedbackInput ? feedbackInput.value.trim() : '';

      const oldExpVal = enrollDateInputValue('expires_at', oldRow.expires_at);
      const oldNextDateVal = enrollDateInputValue('next_date', oldRow.next_date || oldRow.next_payment_date);
      const oldAccessVal = /^full access$/i.test(String(oldRow.access_type || '')) ? 'Full Access' : 'Limited Access';

      const expChanged = (expVal !== oldExpVal);
      const nextDateChanged = (ndVal !== oldNextDateVal);
      const accessChanged = Boolean(accessVal && accessVal !== oldAccessVal);
      const payChanged = Boolean(addPaidVal && Number(addPaidVal) > 0);
      const fbChanged = Boolean(fbText);

      // Confirmation dialog showing ONLY actual changed fields
      const studentName = oldRow.name || 'Student';
      const summary = [];
      if (expChanged) {
        summary.push(`• মেয়াদ (Expires At): ${expVal ? (formatReadableDate(expVal) || expVal) : 'মুছে ফেলা হয়েছে (Cleared)'}`);
      }
      if (nextDateChanged) {
        summary.push(`• পরবর্তী পেমেন্ট (Next Date): ${ndVal ? (formatReadableDate(ndVal) || ndVal) : 'মুছে ফেলা হয়েছে (Cleared)'}`);
      }
      if (accessChanged) {
        summary.push(`• অ্যাক্সেস টাইপ: ${accessVal}`);
      }
      if (payChanged) {
        summary.push(`• নতুন পেমেন্ট/কিস্তি: ৳ ${fmtMoney(Number(addPaidVal))}`);
      }
      if (fbChanged) {
        summary.push(`• মন্তব্য (Feedback): "${fbText}"`);
      }

      if (summary.length === 0) {
        toast('কোনো তথ্য পরিবর্তন করা হয়নি');
        return;
      }

      const confirmMsg = `আপনি কি নিশ্চিত যে ${studentName}-এর এনরোলমেন্টের পরিবর্তনগুলো সেভ করতে চান?\n\nপরিবর্তনের বিবরণ:\n${summary.join('\n')}`;
      if (!confirm(confirmMsg)) return;

      const saveBtn = document.getElementById('dmSaveEnrollBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
      }

      const d = {};

      // 1. Expires At (only if changed)
      if (expChanged) {
        if (expVal) {
          d.expires_at = new Date(expVal + 'T23:59:59.999Z').toISOString();
          const expIso = parseNextDateToIso(d.expires_at);
          if (expIso) {
            d.status = (expIso < getTodayIso()) ? 'Expired' : 'Active';
          }
        } else {
          d.expires_at = '';
        }
      }

      // 2. Next Payment Date (only if changed)
      if (nextDateChanged) {
        d.next_date = ndVal ? fmtDateInput(ndVal) : '';
      }

      // 3. Access Type (only if changed)
      if (accessChanged) {
        d.access_type = accessVal;
      }

      // 4. Add Payment (Installment)
      if (payChanged) {
        const addAmt = Number(addPaidVal);
        const oldPaid = moneyNumber(oldRow.paid) || 0;
        d.paid = String(oldPaid + addAmt);

        let hist = [];
        try {
          const raw = cellValue(oldRow.payment_history).trim();
          if (raw) {
            const p = JSON.parse(raw);
            if (Array.isArray(p)) hist = p;
          }
        } catch { }
        hist.push({
          date: new Date().toISOString(),
          amount: addAmt,
          admin: String(S.user?.name || 'Admin').trim() || 'Admin'
        });
        d.payment_history = JSON.stringify(hist);
      }

      // 5. Add Feedback
      if (fbChanged) {
        const todayDate = getTodayIso();
        let fbList = [];
        const rawFb = cellValue(oldRow.feedback ?? oldRow.Feedback).trim();
        if (rawFb) {
          try {
            const parsed = JSON.parse(rawFb);
            if (Array.isArray(parsed)) fbList = parsed;
          } catch (err) {
            if (rawFb) fbList.push({ date: todayDate, text: rawFb, admin: 'Admin' });
          }
        }
        fbList.push({
          date: todayDate,
          text: fbText,
          admin: String(S.user?.name || 'Admin').trim() || 'Admin'
        });
        const fbCol = (S.cols || []).find(c => colName(c).toLowerCase() === 'feedback');
        const fbColName = fbCol ? colName(fbCol) : 'Feedback';
        d[fbColName] = JSON.stringify(fbList);
      }

      try {
        await api('admin_save', { table: 'student_enrolled', rowid: id, data: d });
        pageCache.delete(cacheKey());
        toast('Enrollment saved successfully');
        closeDetail();
        refresh();
      } catch (e) {
        toast(e.message || 'Save failed');
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '💾 Save Changes';
        }
      }
    }

    function colName(c) {
      if (typeof c === 'string') return c;
      if (!c || typeof c !== 'object') return '';
      return String(c.name ?? c.column_name ?? c.key ?? c.columnName ?? '');
    }
    function colType(c) {
      if (!c || typeof c !== 'object') return 'TEXT';
      return String(c.type ?? 'TEXT').toUpperCase();
    }
    function cellValue(v) {
      if (v === null || v === undefined) return '';
      if (typeof v === 'object') {
        try { return JSON.stringify(v); }
        catch { return '[Object]'; }
      }
      return String(v);
    }
    function isDateColumn(name) {
      return /(^|_)(date|timestamp|created_at|updated_at|enrolled_at|expires_at|next_date|last_attempt_at)($|_)/i.test(String(name || ''));
    }
    function formatDateOnly(value) {
      const raw = String(value ?? '').trim();
      if (!raw) return '';
      const match = /^(\d{4}-\d{2}-\d{2})/.exec(raw);
      return match ? match[1] : raw.split('T')[0];
    }
    function formatNextPaymentDate(value) {
      const raw = String(value ?? '').trim();
      if (!raw) return '';
      const slash = /^(\d{4})\/(\d{2})\/(\d{2})$/.exec(raw);
      if (slash) return raw;
      const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
      return iso ? `${iso[1]}/${iso[2]}/${iso[3]}` : raw.split('T')[0].replace(/-/g, '/');
    }
    function shortValue(v, max = 180) {
      const s = cellValue(v);
      return s.length > max ? s.slice(0, max - 1) + '…' : s;
    }
    function isSecretColumn(c) {
      return /^(password|active_token|token|secret)$/i.test(colName(c));
    }
    function isLargeColumn(c) {
      const n = colName(c);
      return /description|long_description|text|address|url|link|feature|chapter|class|content|details|note|message|json|data|image/i.test(n);
    }
    function inputValue(v) {
      return cellValue(v);
    }
    function renderCell(v, c) {
      const name = colName(c);
      if (isSecretColumn(c)) return '<span class="secret">••••••••</span>';
      const previewMax = isLargeColumn(c) ? 55 : 180;
      const raw = shortValue(v, previewMax);
      const s = isDateColumn(name) ? formatDateOnly(raw) : raw;
      if (!s) return '<span class="muted">—</span>';
      if (/^https?:\/\//i.test(s)) {

      }

        const limitParam = isStudentTable() ? 1000 : S.limit;
        const response = await api('admin_rows', {
          table: S.table,
          search: S.search,
          offset: isStudentTable() ? 0 : S.offset,
          limit: limitParam,
          level: S.levelFilter || '',
          course: S.courseFilter || '',
          due: S.dueFilter || '',
          enrolledDate: S.enrolledDateFilter || '',
          nextDate: S.nextDateFilter || ''
        });
        if (requestId !== refreshSeq) return;

    async function save(e) {
      e.preventDefault();
      const d = {};
      document.querySelectorAll('#ef [data-c]').forEach(x => {
        if (x.disabled || x.readOnly) return;
        if (x.dataset.enrollDate) {
          if (!x.value) { d[x.dataset.c] = ''; return; }
          d[x.dataset.c] = x.dataset.c === 'next_date'
            ? fmtDateInput(x.value)
            : new Date(x.value + 'T23:59:59.999Z').toISOString();
          return;
        }
        d[x.dataset.c] = x.value;
      });
      if (isEnrollTable()) {
        const ridVal = Number(document.getElementById('rid').value) || 0;
        const oldRow = (S.rawEnrollRows?.length ? S.rawEnrollRows : S.rows).find(x => Number(x.__rowid) === ridVal);
        // Automatic Status sync: check date first, then set status column
        const expVal = (d.expires_at !== undefined && d.expires_at !== '') ? d.expires_at : oldRow?.expires_at;
        if (expVal) {
          const expIso = parseNextDateToIso(expVal);
          if (expIso) {
            const todayIso = getTodayIso();
            d.status = (expIso < todayIso) ? 'Expired' : 'Active';
          }
        }
        if (oldRow) {
          const addStr = String(d.paid ?? '').replace(/[^\d.]/g, '').trim();
          if (addStr && Number(addStr) > 0) {
            const add = Number(addStr);
            const oldPaid = moneyNumber(oldRow.paid) || 0;
            d.paid = String(oldPaid + add);
            let hist = [];
            try { const raw = cellValue(oldRow.payment_history).trim(); if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) hist = p; } } catch { }
            const now = new Date();
            const dateStr = now.toISOString();
            hist.push({ date: dateStr, amount: add, admin: String(S.user?.name || 'Admin').trim() || 'Admin' });
            d.payment_history = JSON.stringify(hist);
          } else {
            delete d.paid;
          }

          // Feedback handling: append newly typed feedback
          const fbInput = document.getElementById('efFeedbackText');
          const fbText = String(fbInput?.value ?? '').trim();
          if (fbText) {
            const todayDate = getTodayIso();
            let fbList = [];
            const rawFb = cellValue(oldRow.feedback ?? oldRow.Feedback).trim();
            if (rawFb) {
              try {
                const parsed = JSON.parse(rawFb);
                if (Array.isArray(parsed)) fbList = parsed;
              } catch (err) {
                if (rawFb) fbList.push({ date: todayDate, text: rawFb, admin: 'Admin' });
              }
            }
            fbList.push({
              date: todayDate,
              text: fbText,
              admin: String(S.user?.name || 'Admin').trim() || 'Admin'
            });
            const fbCol = (S.cols || []).find(c => colName(c).toLowerCase() === 'feedback');
            const fbColName = fbCol ? colName(fbCol) : 'Feedback';
            d[fbColName] = JSON.stringify(fbList);
          }
        }
      }
      try {
        const ridEl = document.getElementById('rid');
        await api('admin_save', { table: S.table, rowid: Number(ridEl?.value) || 0, data: d });
        pageCache.delete(cacheKey());
        toast('Saved successfully');
        closeDrawer();
        refresh();
      } catch (e) { toast(e.message || 'Save failed') }
    }

    function ccGetUniqueSubjects(courseName) {
      const s = new Set();
      const target = String(courseName || '').trim().toLowerCase();
      (ccState.rows || []).forEach(r => {
        if (target && String(r.course_name || '').trim().toLowerCase() !== target) return;
        const v = String(r.subject || '').trim();
        if (v) s.add(v);
      });
      return Array.from(s).sort((a, b) => a.localeCompare(b));
    }

    function ccGetUniqueChapters(courseName, subjectName) {
      const s = new Set();
      const targetC = String(courseName || '').trim().toLowerCase();
      const targetS = String(subjectName || '').trim().toLowerCase();
      (ccState.rows || []).forEach(r => {
        if (targetC && String(r.course_name || '').trim().toLowerCase() !== targetC) return;
        if (targetS && String(r.subject || '').trim().toLowerCase() !== targetS) return;
        const v = String(r.chapter || '').trim();
        if (v) s.add(v);
      });
      return Array.from(s).sort((a, b) => a.localeCompare(b));

    async function ccSaveClass(andNext = true) {
      const course = ccState.isNewCourse
        ? (document.getElementById('ccCourseInput')?.value.trim() || '')
        : (document.getElementById('ccCourseSelect')?.value.trim() || '');

      const subject = ccState.isNewSubject
        ? (document.getElementById('ccSubjectInput')?.value.trim() || '')
        : (document.getElementById('ccSubjectSelect')?.value.trim() || '');

      const chapter = ccState.isNewChapter
        ? (document.getElementById('ccChapterInput')?.value.trim() || '')
        : (document.getElementById('ccChapterSelect')?.value.trim() || '');

      const className = document.getElementById('ccClassName')?.value.trim() || '';
      const url = document.getElementById('ccUrl')?.value.trim() || '';
      const pdfUrl = document.getElementById('ccPdfUrl')?.value.trim() || '';

      if (!course) {
        toast('অনুগ্রহ করে কোর্সের নাম দিন');
        if (ccState.isNewCourse) document.getElementById('ccCourseInput')?.focus();
        else document.getElementById('ccCourseSelect')?.focus();
        return;
      }
      if (!subject) {
        toast('অনুগ্রহ করে সাবজেক্টের নাম দিন');
        if (ccState.isNewSubject) document.getElementById('ccSubjectInput')?.focus();
        else document.getElementById('ccSubjectSelect')?.focus();
        return;
      }
      if (!chapter) {
        toast('অনুগ্রহ করে চ্যাপ্টারের নাম দিন');
        if (ccState.isNewChapter) document.getElementById('ccChapterInput')?.focus();
        else document.getElementById('ccChapterSelect')?.focus();
        return;
      }
      if (!className) {
        toast('অনুগ্রহ করে ক্লাসের নাম দিন (যেমন: 1st class DCU)');
        document.getElementById('ccClassName')?.focus();
        return;
      }
      if (!url) {
        toast('অনুগ্রহ করে ভিডিও লিংক দিন (YouTube / Video URL)');
        document.getElementById('ccUrl')?.focus();
        return;
      }

      const btn = document.getElementById('ccBtnSaveNext');
      const prevText = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'সেভ হচ্ছে…';
      }

      try {
        const res = await api('admin_save', {
          table: ccState.activeTable,
          rowid: 0,
          data: {
            course_name: course,
            subject: subject,
            chapter: chapter,
            class_name: className,
            url: url,
            pdf_url: pdfUrl
          }
        });

        const newRowId = res.rowid || Date.now();
        const newRow = {
          __rowid: newRowId,
          course_name: course,
          subject: subject,
          chapter: chapter,
          class_name: className,
          url: url,
          pdf_url: pdfUrl
        };

        // Add to local state (at beginning so it is immediately visible)
        ccState.rows.unshift(newRow);
        pageCache.delete(ccState.activeTable);

        // Ensure selected state
        ccState.course = course;
        ccState.subject = subject;
        ccState.chapter = chapter;

        // Reset new-mode flags if newly typed
        if (ccState.isNewCourse) ccToggleNewCourse();
        if (ccState.isNewSubject) ccToggleNewSubject();
        if (ccState.isNewChapter) ccToggleNewChapter();

        ccPopulateDropdowns();
        ccUpdateStats();
        ccRenderTable();

        // Clear class inputs
        document.getElementById('ccClassName').value = '';
        document.getElementById('ccUrl').value = '';
        document.getElementById('ccPdfUrl').value = '';

        if (andNext) {
          toast('✅ ক্লাস সেভ হয়েছে! পরবর্তী ক্লাস দিন।');
          document.getElementById('ccClassName')?.focus();
        } else {
          toast('✅ ক্লাস সফলভাবে সেভ হয়েছে!');
        }
      } catch (err) {
        toast(err.message || 'ক্লাস সেভ করতে সমস্যা হয়েছে');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = prevText;
        }
      }
    }

    function ccRenderTable() {
      const body = document.getElementById('ccTableBody');
      const countEl = document.getElementById('ccVisibleCount');
      if (!body) return;

      const targetCourse = String(ccState.filterCourse || '').trim().toLowerCase();
      const targetSubject = String(ccState.filterSubject || '').trim().toLowerCase();
      const targetChapter = String(ccState.filterChapter || '').trim().toLowerCase();
      const q = String(ccState.search || '').trim().toLowerCase();

      const filtered = ccState.rows.filter(r => {
        if (targetCourse && String(r.course_name || '').trim().toLowerCase() !== targetCourse) return false;
        if (targetSubject && String(r.subject || '').trim().toLowerCase() !== targetSubject) return false;
        if (targetChapter && String(r.chapter || '').trim().toLowerCase() !== targetChapter) return false;
        if (q) {
          const match = [r.course_name, r.subject, r.chapter, r.class_name, r.url, r.pdf_url]
            .some(val => String(val || '').toLowerCase().includes(q));
          if (!match) return false;
        }
        return true;
      });

      if (countEl) countEl.textContent = `প্রদর্শিত ক্লাস: ${filtered.length} টি`;

      if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="7" class="empty">কোনো ক্লাস পাওয়া যায়নি। উপরে ফরম ব্যবহার করে দ্রুত ক্লাস যোগ করুন।</td></tr>`;
        return;
      }

      body.innerHTML = filtered.map((r, i) => {
        const rowId = r.__rowid || r.rowid || r.id;
        const url = String(r.url || '').trim();
        const pdf = String(r.pdf_url || '').trim();

        const videoBtn = url
          ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="cc-link-btn cc-link-video" title="${esc(url)}">▶ ভিডিও দেখুন ↗</a>`
          : `<span class="muted">—</span>`;

        const pdfBtn = pdf
          ? `<a href="${esc(pdf)}" target="_blank" rel="noopener" class="cc-link-btn cc-link-pdf" title="${esc(pdf)}">📄 শিট / PDF ↗</a>`
          : `<span class="muted">—</span>`;

        return `<tr>
      <td style="font-weight:800;color:#64748b;font-size:12px">#${i + 1}</td>
      <td><div style="font-weight:700;color:#1e40af;font-size:13px">${esc(r.course_name || '—')}</div></td>
      <td><div style="font-weight:700;color:#0f172a">${esc(r.subject || '—')}</div></td>
      <td><span style="font-weight:600;color:#475569;background:#f1f5f9;padding:2px 8px;border-radius:6px;font-size:12px">${esc(r.chapter || '—')}</span></td>
      <td><div style="font-weight:800;color:#0f172a;font-size:13.5px">${esc(r.class_name || '—')}</div></td>
      <td>${videoBtn}</td>
      <td>${pdfBtn}</td>
      <td class="actions-cell">
        <div class="act">
          <button type="button" class="adm-act-btn act-edit" onclick="openCcEditModal(${rowId})" title="এডিট করুন">✏ Edit</button>
          <button type="button" class="adm-act-btn act-del" onclick="deleteCcClass(${rowId})" title="ডিলিট করুন">🗑 Delete</button>
        </div>
      </td>
    </tr>`;
      }).join('');
    }

    async function ccSwitchLevel(tableId) {
      ccState.activeTable = tableId;
      ccState.course = '';
      ccState.subject = '';
      ccState.chapter = '';
      ccState.filterCourse = '';
      ccState.filterSubject = '';
      ccState.filterChapter = '';
      ccState.search = '';

      // 1. Highlight clicked level button immediately
      document.querySelectorAll('.cc-level-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.table === tableId);
      });

      const curLevel = CC_LEVELS.find(l => l.id === tableId) || { name: tableId, icon: '📚' };
      const mainArea = document.getElementById('ccMainArea');

      // 2. Immediately show clean loading screen with animated spinner (NO old content flash!)
      if (mainArea) {
        mainArea.innerHTML = `
      <div class="cc-loading-screen">
        <div class="cc-pulse-spinner"></div>
        <div style="font:800 22px 'Baloo Da 2',sans-serif;color:#0f172a;margin-bottom:4px">
          ${curLevel.icon} ${esc(curLevel.name)} এর ডাটাবেজ লোড হচ্ছে…
        </div>
        <div style="font-size:13px;color:#64748b">
          Cloudflare D1 থেকে ক্লাস, সাবজেক্ট ও চ্যাপ্টারের তথ্য প্রস্তুত করা হচ্ছে
        </div>
      </div>
    `;
      }

      // 3. Fetch from API
      try {
        const res = await api('admin_rows', {
          table: tableId,
          search: '',
          offset: 0,
          limit: 1000000
        });
        const d = res.data || {};
        ccState.rows = Array.isArray(d.rows) ? d.rows : [];
        pageCache.set(tableId, { allRows: ccState.rows, loadedAt: Date.now() });
      } catch (err) {
        toast(`ডাটাবেজ লোড ব্যর্থ: ${err.message || err}`);
        ccState.rows = [];
      }

      // 4. Update level badge count
      const activeBtn = document.querySelector(`.cc-level-btn[data-table="${tableId}"] .cc-badge-count`);
      if (activeBtn) activeBtn.textContent = ccState.rows.length;

      // 5. Pre-select first course, subject, chapter if available
      const courses = ccGetUniqueCourses();
      if (courses.length > 0) {
        ccState.course = courses[0];
        const subjects = ccGetUniqueSubjects(ccState.course);
        if (subjects.length > 0) {
          ccState.subject = subjects[0];
          const chapters = ccGetUniqueChapters(ccState.course, ccState.subject);
          if (chapters.length > 0) {
            ccState.chapter = chapters[0];
          }
        }
      }

      // 6. Smoothly render the full studio into ccMainArea
      renderLoadedStudio(curLevel);
    }

    // ============================================================
    // ZOOM MEETING MANAGER CONTROLLER
    // ============================================================

    let zoomManagerData = {
      courses: [],
      meetings: [],
      selectedCourses: [],
      levelFilter: '',
      searchQuery: ''
    };

    const ZOOM_LEVEL_TABS = [
      { id: '', name: 'সকল লেভেল', icon: '🌐' },
      { id: 'BBA DCU', name: 'BBA DCU', icon: '🎓' },
      { id: 'BBA NU', name: 'BBA NU', icon: '🎓' },
      { id: 'BBA Professional', name: 'BBA Professional', icon: '💼' },
      { id: 'BBS', name: 'BBS', icon: '🏛' },
      { id: 'MBA', name: 'MBA', icon: '🎖' },
      { id: 'HSC', name: 'HSC', icon: '📚' },
      { id: 'SSC', name: 'SSC', icon: '🎒' }
    ];

    function getCourseAcademicLevel(c) {
      if (!c) return 'Course';
      const rawLevel = String(c.level || '').trim().toUpperCase();
      const rawName = String(c.name || '').trim().toUpperCase();

      // 1. Explicit Non-BBA Levels first (tag has NO effect on these)
      if (rawLevel === 'MBA' || (!rawLevel && rawName.includes('MBA'))) return 'MBA';
      if (rawLevel === 'HSC' || (!rawLevel && rawName.includes('HSC'))) return 'HSC';
      if (rawLevel === 'SSC' || (!rawLevel && rawName.includes('SSC'))) return 'SSC';
      if (rawLevel === 'BBS' || (!rawLevel && rawName.includes('BBS'))) return 'BBS';
      if (rawLevel.includes('PROFESSIONAL') || rawName.includes('PROFESSIONAL')) return 'BBA Professional';

      // 2. If it is BBA
      if (rawLevel.includes('BBA') || rawName.includes('BBA') || rawLevel === 'BBA DCU' || rawLevel === 'BBA NU') {
        return 'BBA';
      }

      if (rawLevel) {
        if (rawLevel.includes('MBA')) return 'MBA';
        if (rawLevel.includes('HSC')) return 'HSC';
        if (rawLevel.includes('SSC')) return 'SSC';
        if (rawLevel.includes('BBS')) return 'BBS';
        return c.level;
      }

      return 'Course';
    }

    function doesCourseMatchLevel(c, targetLevel) {
      if (!c) return false;
      if (!targetLevel) return true; // All levels

      const baseLevel = getCourseAcademicLevel(c);

      // Non-BBA levels: ONLY match if baseLevel equals targetLevel!
      if (targetLevel === 'MBA') return baseLevel === 'MBA';
      if (targetLevel === 'HSC') return baseLevel === 'HSC';
      if (targetLevel === 'SSC') return baseLevel === 'SSC';
      if (targetLevel === 'BBS') return baseLevel === 'BBS';
      if (targetLevel === 'BBA Professional') return baseLevel === 'BBA Professional';

      // For BBA DCU or BBA NU: MUST be a BBA course!
      if (baseLevel !== 'BBA') return false;

      const rawLevel = String(c.level || '').trim().toUpperCase();
      const rawTag = String(c.tag || '').trim().toUpperCase();
      const rawName = String(c.name || '').trim().toUpperCase();

      if (targetLevel === 'BBA DCU') {
        if (rawLevel === 'BBA DCU') return true;
        if (rawTag.includes('DCU') || rawLevel.includes('DCU') || rawName.includes('DCU') || rawName.includes('7 COLLEGE') || rawName.includes('DHAKA')) return true;
        // General BBA without NU-only tag
        if (rawTag === 'NU' || (rawName.includes('NU') && !rawName.includes('DCU'))) return false;
        return true;
      }

      if (targetLevel === 'BBA NU') {
        if (rawLevel === 'BBA NU') return true;
        if (rawTag.includes('NU') || rawLevel.includes('NU') || rawName.includes('NU') || rawName.includes('NATIONAL')) return true;
        // General BBA without DCU-only tag
        if (rawTag === 'DCU' || (rawName.includes('DCU') && !rawName.includes('NU'))) return false;
        return true;
      }

      return false;
    }

    function getZoomCourseLevelBadge(c) {
      if (!c) return 'Course';
      const baseLevel = getCourseAcademicLevel(c);

      // Non-BBA levels: just show their level! (MBA, HSC, SSC, BBS, BBA Professional)
      if (baseLevel !== 'BBA') {
        return baseLevel;
      }

      // For BBA only: show tag if specific, else BBA
      const isDcu = doesCourseMatchLevel(c, 'BBA DCU');
      const isNu = doesCourseMatchLevel(c, 'BBA NU');

      if (isDcu && !isNu) return 'BBA (DCU)';
      if (isNu && !isDcu) return 'BBA (NU)';
      return 'BBA';
    }

    function renderZoomLevelButtons() {
      return ZOOM_LEVEL_TABS.map(l => `
        <button type="button" class="cc-level-btn ${zoomManagerData.levelFilter === l.id ? 'active' : ''}" data-level="${esc(l.id)}" onclick="setZoomLevelFilter('${esc(l.id)}')">
          <span>${l.icon}</span>
          <span>${esc(l.name)}</span>
          <span class="cc-badge-count" data-zoom-level-badge="${esc(l.id)}">…</span>
        </button>
      `).join('');
    }

    function updateZoomLevelBadges() {
      const courses = zoomManagerData.courses || [];
      const counts = { '': courses.length };
      ZOOM_LEVEL_TABS.forEach(t => { if (t.id) counts[t.id] = 0; });
      for (const c of courses) {
        for (const t of ZOOM_LEVEL_TABS) {
          if (t.id && doesCourseMatchLevel(c, t.id)) {
            counts[t.id]++;
          }
        }
      }
      document.querySelectorAll('#zoomLevelBar .cc-badge-count').forEach(b => {
        const l = b.dataset.zoomLevelBadge ?? '';
        b.textContent = counts[l] !== undefined ? counts[l] : '0';
      });
    }

    function setZoomLevelFilter(lvl) {
      if (zoomManagerData.levelFilter === lvl && lvl !== '') {
        zoomManagerData.levelFilter = '';
      } else {
        zoomManagerData.levelFilter = String(lvl || '');
      }
      document.querySelectorAll('#zoomLevelBar .cc-level-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === zoomManagerData.levelFilter);
      });
      renderZoomCoursesGrid();
    }

    function onZoomCourseSearch(q) {
      zoomManagerData.searchQuery = String(q || '').trim().toLowerCase();
      renderZoomCoursesGrid();
    }

    function findMeetingForCourse(courseName) {
      if (!courseName) return null;
      const target = String(courseName).trim().toLowerCase();
      return (zoomManagerData.meetings || []).find(m =>
        String(m.course_name || '').trim().toLowerCase() === target
      ) || null;
    }

    function getVisibleZoomCourses() {
      const q = zoomManagerData.searchQuery;
      const lvl = zoomManagerData.levelFilter;
      const list = (zoomManagerData.courses || []).filter(c => {
        const cName = String(c.name || '').trim();
        if (!cName) return false;
        if (lvl && !doesCourseMatchLevel(c, lvl)) return false;
        if (q && !cName.toLowerCase().includes(q)) return false;
        return true;
      });

      // Sort: যে কোর্সগুলোতে রানিং মিটিং আছে সেগুলো সর্বপ্রথমে (1st-এ) দেখাবে
      list.sort((a, b) => {
        const mA = findMeetingForCourse(a.name);
        const mB = findMeetingForCourse(b.name);
        const hasA = (mA && String(mA.meeting_id || '').trim() !== '') ? 1 : 0;
        const hasB = (mB && String(mB.meeting_id || '').trim() !== '') ? 1 : 0;
        if (hasA !== hasB) {
          return hasB - hasA; // রানিং মিটিং সবার আগে
        }
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      return list;
    }

    function renderZoomCoursesGrid() {
      const container = document.getElementById('zoomCoursesGrid');
      if (!container) return;

      const filtered = getVisibleZoomCourses();

      if (!filtered.length) {
        container.innerHTML = `<div class="panel" style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#64748b">
          <div style="font-size:32px;margin-bottom:8px">🔍</div>
          <div style="font-weight:700">কোনো কোর্স পাওয়া যায়নি</div>
        </div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const cName = String(c.name || '').trim();
        const cLevel = getZoomCourseLevelBadge(c);
        const meeting = findMeetingForCourse(cName);
        const isSelected = zoomManagerData.selectedCourses.includes(cName);
        const hasActiveMeeting = !!(meeting && String(meeting.meeting_id || '').trim());

        const meetingInfoHtml = hasActiveMeeting
          ? `<div class="zcc-meeting-info has-meeting">
              <div style="color:#16a34a; font-weight:800; display:flex; align-items:center; gap:5px; margin-bottom:3px;">
                <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 2px #bbf7d0;"></span>
                লাইভ ক্লাস চলছে
              </div>
              <div>🟢 <b>Meeting ID:</b> ${esc(meeting.meeting_id)}</div>
              <div>🔑 <b>Passcode:</b> ${esc(meeting.passcode || 'নেই')}</div>
            </div>`
          : `<div class="zcc-meeting-info">
              <div>⚪ লাইভ মিটিং সেট করা নেই</div>
            </div>`;

        return `
          <div class="zoom-course-card ${isSelected ? 'selected' : ''} ${hasActiveMeeting ? 'has-active-meeting' : ''}" onclick="toggleZoomCourseSelection('${esc(cName)}')">
            <div class="zcc-top">
              <div class="zcc-header-left">
                <div class="zcc-checkbox">${isSelected ? '✓' : ''}</div>
                <div class="zcc-title">${esc(cName)}</div>
              </div>
              <span class="zcc-level-badge">${esc(cLevel)}</span>
            </div>
            ${meetingInfoHtml}
          </div>
        `;
      }).join('');
    }

    function syncZoomTopDisplay(opts = {}) {
      const count = zoomManagerData.selectedCourses.length;
      const nameEl = document.getElementById('zoomSelectedCourseName');
      const tagEl = document.getElementById('zoomStatusBadge');
      const idInp = document.getElementById('zoomMeetingIdInput');
      const passInp = document.getElementById('zoomPasscodeInput');
      const saveBtn = document.getElementById('btnSaveZoomMeeting');
      const delBtn = document.getElementById('btnDeleteZoomMeeting');
      const pillsWrap = document.getElementById('zoomSelectedPillsWrap');
      const countBadge = document.getElementById('zoomSelectionCountBadge');

      if (countBadge) {
        countBadge.textContent = `${count}টি নির্বাচিত`;
      }

      const hasUserTypedId = idInp && idInp.value.trim() !== '';

      if (count === 0) {
        if (nameEl) nameEl.textContent = 'নিচ থেকে এক বা একাধিক কোর্স সিলেক্ট করুন';
        if (tagEl) {
          tagEl.className = 'zoom-meeting-status-tag unconfigured';
          tagEl.textContent = 'কোনো কোর্স সিলেক্ট করা নেই';
        }
        if (opts.clearInputs) {
          if (idInp) idInp.value = '';
          if (passInp) passInp.value = '';
        }
        if (saveBtn) saveBtn.textContent = '✓ সেভ / আপডেট করুন (Save Changes)';
        if (delBtn) delBtn.textContent = '✕ মিটিং মুছে ফেলুন';
        if (pillsWrap) {
          pillsWrap.style.display = 'none';
          pillsWrap.innerHTML = '';
        }
        return;
      }

      if (count === 1) {
        const singleName = zoomManagerData.selectedCourses[0];
        if (nameEl) nameEl.textContent = singleName;
        const meeting = findMeetingForCourse(singleName);
        if (meeting && meeting.meeting_id) {
          // যদি ইনপুট ফিল্ড খালি থাকে বা কোর্স থেকে ডাটা লোড করার কথা বলা হয়, তবেই মিটিং আইডি বসবে
          if (!hasUserTypedId || opts.loadFromCourse) {
            if (idInp) idInp.value = meeting.meeting_id;
            if (passInp) passInp.value = meeting.passcode || '';
          }
          if (tagEl) {
            tagEl.className = 'zoom-meeting-status-tag active';
            tagEl.textContent = '🟢 মিটিং সেট করা আছে';
          }
        } else {
          // ইউজার আগে থেকেই আইডি লিখে থাকলে তা মুছবে না
          if (!hasUserTypedId && opts.clearInputs) {
            if (idInp) idInp.value = '';
            if (passInp) passInp.value = '';
          }
          if (tagEl) {
            tagEl.className = 'zoom-meeting-status-tag unconfigured';
            tagEl.textContent = '⚪ মিটিং সেট করা নেই';
          }
        }
        if (saveBtn) saveBtn.textContent = `✓ "${singleName}" সেভ করুন`;
        if (delBtn) delBtn.textContent = `✕ এই কোর্সের মিটিং মুছুন`;
        if (pillsWrap) {
          pillsWrap.style.display = 'none';
          pillsWrap.innerHTML = '';
        }
        return;
      }

      // count > 1
      if (nameEl) nameEl.textContent = `${count}টি কোর্স একসাথে নির্বাচিত`;
      if (tagEl) {
        const runningInSelected = zoomManagerData.selectedCourses.filter(cn => {
          const m = findMeetingForCourse(cn);
          return m && String(m.meeting_id || '').trim() !== '';
        }).length;

        tagEl.className = 'zoom-meeting-status-tag active';
        if (runningInSelected === count) {
          tagEl.textContent = `🟢 ${count}টিতেই লাইভ মিটিং রানিং`;
        } else if (runningInSelected > 0) {
          tagEl.textContent = `⚡ Multi-Select (${runningInSelected}/${count}টি রানিং)`;
        } else {
          tagEl.textContent = `⚡ Multi-Select (${count}টি নির্বাচিত)`;
        }
      }

      if (saveBtn) saveBtn.textContent = `✓ নির্বাচিত (${count}টি) কোর্সে একযোগে সেভ করুন`;
      if (delBtn) delBtn.textContent = `✕ নির্বাচিত (${count}টি) কোর্সের মিটিং মুছুন`;

      if (pillsWrap) {
        pillsWrap.style.display = 'flex';
        pillsWrap.innerHTML = zoomManagerData.selectedCourses.map(cName => `
          <span class="zsp-pill">
            <span>${esc(cName)}</span>
            <span class="zsp-pill-remove" onclick="removeSelectedZoomCourse('${esc(cName)}', event)" title="বাদ দিন">×</span>
          </span>
        `).join('');
      }
    }

    function toggleZoomCourseSelection(courseName) {
      if (!courseName) return;
      const idInp = document.getElementById('zoomMeetingIdInput');
      const passInp = document.getElementById('zoomPasscodeInput');
      const hasTypedId = idInp && idInp.value.trim() !== '';

      const idx = zoomManagerData.selectedCourses.indexOf(courseName);
      if (idx >= 0) {
        zoomManagerData.selectedCourses.splice(idx, 1);
      } else {
        zoomManagerData.selectedCourses.push(courseName);
        // যদি টেক্সটবক্সে আগে থেকে আইডি লেখা না থাকে এবং এই কোর্সে মিটিং থাকে, তবে ইনপুটে লোড করবে
        if (!hasTypedId) {
          const meeting = findMeetingForCourse(courseName);
          if (meeting && meeting.meeting_id) {
            if (idInp) idInp.value = meeting.meeting_id;
            if (passInp) passInp.value = meeting.passcode || '';
          }
        }
      }

      syncZoomTopDisplay();
      renderZoomCoursesGrid();
    }

    function selectOnlyRunningZoomCourses() {
      const running = [];
      let firstMeetingId = '';
      let firstPasscode = '';
      for (const c of zoomManagerData.courses) {
        const m = findMeetingForCourse(c.name);
        if (m && String(m.meeting_id || '').trim() !== '') {
          running.push(String(c.name || '').trim());
          if (!firstMeetingId) {
            firstMeetingId = String(m.meeting_id || '').trim();
            firstPasscode = String(m.passcode || '').trim();
          }
        }
      }
      if (!running.length) {
        toast('ℹ️ বর্তমানে কোনো কোর্সে রানিং মিটিং নেই।');
        return;
      }
      zoomManagerData.selectedCourses = running;
      const idInp = document.getElementById('zoomMeetingIdInput');
      const passInp = document.getElementById('zoomPasscodeInput');
      if (idInp) idInp.value = firstMeetingId;
      if (passInp) passInp.value = firstPasscode;
      syncZoomTopDisplay();
      renderZoomCoursesGrid();
    }

    function selectAllVisibleZoomCourses() {
      const visible = getVisibleZoomCourses();
      const set = new Set(zoomManagerData.selectedCourses);
      visible.forEach(c => {
        const cName = String(c.name || '').trim();
        if (cName) set.add(cName);
      });
      zoomManagerData.selectedCourses = Array.from(set);

      const idInp = document.getElementById('zoomMeetingIdInput');
      const passInp = document.getElementById('zoomPasscodeInput');
      if (idInp && !idInp.value && visible.length > 0) {
        const m = findMeetingForCourse(visible[0].name);
        if (m && m.meeting_id) {
          idInp.value = m.meeting_id;
          if (passInp) passInp.value = m.passcode || '';
        }
      }

      syncZoomTopDisplay();
      renderZoomCoursesGrid();
    }

    function deselectAllZoomCourses() {
      zoomManagerData.selectedCourses = [];
      syncZoomTopDisplay({ clearInputs: false });
      renderZoomCoursesGrid();
    }

    function removeSelectedZoomCourse(cName, e) {
      if (e) e.stopPropagation();
      zoomManagerData.selectedCourses = zoomManagerData.selectedCourses.filter(c => c !== cName);
      syncZoomTopDisplay();
      renderZoomCoursesGrid();
    }

    async function saveSelectedZoomMeeting(e) {
      if (e) e.preventDefault();
      const selected = zoomManagerData.selectedCourses;
      if (!selected || !selected.length) {
        alert('অনুগ্রহ করে নিচ থেকে এক বা একাধিক কোর্স সিলেক্ট করুন।');
        return;
      }

      const idInp = document.getElementById('zoomMeetingIdInput');
      const passInp = document.getElementById('zoomPasscodeInput');
      const saveBtn = document.getElementById('btnSaveZoomMeeting');

      const meetingId = String(idInp?.value || '').trim();
      const passcode = String(passInp?.value || '').trim();

      if (!meetingId) {
        alert('অনুগ্রহ করে Meeting ID লিখুন।');
        if (idInp) idInp.focus();
        return;
      }

      const origText = saveBtn ? saveBtn.textContent : '';
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'সেভ হচ্ছে…';
      }

      try {
        const res = await api('panel_admin_save_zoom_meeting', {
          courseNames: selected,
          meetingId,
          passcode
        });

        if (res && res.status === 'ok') {
          for (const cName of selected) {
            const existing = findMeetingForCourse(cName);
            if (existing) {
              existing.meeting_id = meetingId;
              existing.passcode = passcode;
            } else {
              zoomManagerData.meetings.push({
                course_name: cName,
                meeting_id: meetingId,
                passcode: passcode
              });
            }
          }

          toast(`✅ সফলভাবে ${selected.length}টি কোর্সে জুম মিটিং আপডেট করা হয়েছে!`);
          syncZoomTopDisplay();
          renderZoomCoursesGrid();
        } else {
          alert('❌ ' + (res?.message || 'সেভ করতে সমস্যা হয়েছে।'));
        }
      } catch (err) {
        alert('❌ সার্ভার এরর: ' + err.message);
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = origText;
        }
      }
    }

    async function deleteSelectedZoomMeeting() {
      const selected = zoomManagerData.selectedCourses;
      if (!selected || !selected.length) {
        alert('অনুগ্রহ করে আগে এক বা একাধিক কোর্স সিলেক্ট করুন।');
        return;
      }

      const msg = selected.length === 1
        ? `আপনি কি "${selected[0]}" কোর্সের জুম মিটিং মুছে ফেলতে চান?`

    const activityState = {
      loading: false,
      data: null, // { courses: [], enrollments: [] }
      currentView: 'overview', // 'overview' | 'course_detail'
      selectedCourse: null,
      datePreset: 'all', // 'all' | 'today' | '7days' | '30days' | 'custom'
      customFrom: '',
      customTo: ''
    };

    function filterActivityEnrollments(enrollments, datePreset, customFrom, customTo) {
      if (!enrollments || !enrollments.length) return [];
      if (datePreset === 'all') return enrollments;

      const todayIso = getTodayIso();
      if (datePreset === 'today') {
        return enrollments.filter(e => e.date === todayIso);
      }
      if (datePreset === '7days') {
        const past7 = getFutureIso(-7);
        return enrollments.filter(e => e.date && e.date >= past7 && e.date <= todayIso);
      }
      if (datePreset === '30days') {
        const past30 = getFutureIso(-30);
        return enrollments.filter(e => e.date && e.date >= past30 && e.date <= todayIso);
      }
      if (datePreset === 'custom') {
        const from = customFrom || '0000-00-00';
        const to = customTo || '9999-99-99';
        return enrollments.filter(e => e.date && e.date >= from && e.date <= to);
      }
      return enrollments;
    }

    function getActivityDateRangeLabel(preset, from, to) {
      if (preset === 'today') return '📅 আজকের ফলাফল';
      if (preset === '7days') return '📆 বিগত ৭ দিনের ফলাফল';
      if (preset === '30days') return '🗓️ বিগত ৩০ দিনের ফলাফল';
      if (preset === 'custom') {
        if (from && to) return `🗓️ ${from} হতে ${to}`;
        if (from) return `🗓️ ${from} হতে বর্তমান`;
        if (to) return `🗓️ ${to} পর্যন্ত`;
        return '🗓️ কাস্টম সময়কাল';
      }
      return '🌐 সর্বমোট সময়কাল (All Time)';
    }
