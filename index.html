    function renderActivityOverview(container) {
      const allCourses = activityState.data.courses || [];
      const allEnrollments = activityState.data.enrollments || [];

      // Filter enrollments by active date preset
      const filtered = filterActivityEnrollments(
        allEnrollments,
        activityState.datePreset,
        activityState.customFrom,
        activityState.customTo
      );

      // Aggregate calculations
      const totalCoursesCount = allCourses.length;
      const enrolledCount = filtered.length;

      let totalCourseValue = 0;
      let totalDiscount = 0;
      let totalPaid = 0;
      let totalDue = 0;

      for (const e of filtered) {
        totalCourseValue += (e.coursePrice || 0);
        totalDiscount += (e.discount || 0);
        totalPaid += (e.paid || 0);
        totalDue += (e.due || 0);
      }

      const effectiveTotal = Math.max(0, totalCourseValue - totalDiscount);
      const collectionPct = effectiveTotal > 0
        ? Math.min(100, Math.round((totalPaid / effectiveTotal) * 100))
        : (totalPaid > 0 ? 100 : 0);

      const rangeLabel = getActivityDateRangeLabel(
        activityState.datePreset,
        activityState.customFrom,
        activityState.customTo
      );

      // Pre-compute enrollment counts per course for the filtered period
      const courseCountMap = new Map();
      for (const e of filtered) {
        const k = String(e.course || '').toLowerCase().trim();
        courseCountMap.set(k, (courseCountMap.get(k) || 0) + 1);
      }

      let html = `
        ${renderActivityDateFilterBar()}

        <!-- Overall Progress Report Banner -->
        <div class="act-report-card">
          <div class="act-report-head">
            <div class="act-report-title">
              <span>📊 সামগ্রিক প্রগ্রেস ও আর্থিক রিপোর্ট</span>
            </div>
            <span class="act-badge-range">${esc(rangeLabel)}</span>
          </div>

          <div class="act-stats-grid">
            <div class="act-stat-tile">
              <div class="act-stat-top">
                <span class="act-stat-label">মোট কোর্স</span>
                <div class="act-stat-icon-wrap" style="background:#eff6ff;color:#2563eb">📚</div>
              </div>
              <div class="act-stat-number">${totalCoursesCount} টি</div>
            </div>

            <div class="act-stat-tile">
              <div class="act-stat-top">
                <span class="act-stat-label">ভর্তি শিক্ষার্থী</span>
                <div class="act-stat-icon-wrap" style="background:#ecfdf5;color:#059669">👨‍🎓</div>
              </div>
              <div class="act-stat-number" style="color:#059669">${enrolledCount} জন</div>
            </div>

            <div class="act-stat-tile">
              <div class="act-stat-top">
                <span class="act-stat-label">কোর্সের মোট মূল্য</span>
                <div class="act-stat-icon-wrap" style="background:#fef3c7;color:#d97706">💰</div>
              </div>
              <div class="act-stat-number">৳${acFmtMoney(totalCourseValue)}</div>
            </div>

            <div class="act-stat-tile">
              <div class="act-stat-top">
                <span class="act-stat-label">সংগৃহীত টাকা (Paid)</span>
                <div class="act-stat-icon-wrap" style="background:#f0fdf4;color:#16a34a">💵</div>
              </div>
              <div class="act-stat-number" style="color:#16a34a">৳${acFmtMoney(totalPaid)}</div>
            </div>

            <div class="act-stat-tile">
              <div class="act-stat-top">
                <span class="act-stat-label">বকেয়া রয়েছে (Due)</span>
                <div class="act-stat-icon-wrap" style="background:#fff1f2;color:#e11d48">⏳</div>
              </div>
              <div class="act-stat-number" style="color:${totalDue > 0 ? '#e11d48' : '#64748b'}">৳${acFmtMoney(totalDue)}</div>
            </div>

            <div class="act-stat-tile">
              <div class="act-stat-top">
                <span class="act-stat-label">মোট ডিসকাউন্ট</span>
                <div class="act-stat-icon-wrap" style="background:#f5f3ff;color:#7c3aed">🏷️</div>
              </div>
              <div class="act-stat-number" style="color:#7c3aed">৳${acFmtMoney(totalDiscount)}</div>
            </div>
          </div>

          <!-- Collection Progress Bar -->
          <div class="act-progress-wrap">
            <div class="act-progress-labels">
              <span>অর্থ আদায় অগ্রগতি (Collection Rate)</span>
              <span>${collectionPct}% সম্পন্ন · ৳${acFmtMoney(totalPaid)} / ৳${acFmtMoney(effectiveTotal)}</span>
            </div>
            <div class="act-progress-track">
              <div class="act-progress-fill-paid" style="width: ${collectionPct}%"></div>
              <div class="act-progress-fill-due" style="width: ${100 - collectionPct}%"></div>
            </div>
          </div>
        </div>

        <!-- Course Cards Section -->
        <div style="margin-top:8px;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between">
          <div>
            <h3 style="margin:0;font-size:15px;font-weight:800;color:#0f172a">কোর্স তালিকা (${allCourses.length}টি কোর্স)</h3>
            <div style="font-size:12px;color:#64748b;margin-top:2px">কোর্সের বিস্তারিত অগ্রগতি রিপোর্ট দেখতে কোর্সের কার্ডে ক্লিক করুন</div>
          </div>
        </div>

        <div class="act-courses-grid">
      `;

      for (const c of allCourses) {
        const k = String(c.name || '').toLowerCase().trim();
        const stCount = courseCountMap.get(k) || 0;
        const tag = c.tag ? `· ${esc(c.tag)}` : '';
        const level = c.level ? esc(c.level) : '';

        html += `
          <div class="act-course-card" onclick="selectActivityCourse('${esc(c.name)}')">
            <div class="act-cc-head">
              <div style="display:flex;align-items:center;gap:10px">
                <div class="ac-user-avatar" style="background:linear-gradient(135deg,#3b82f6,#2563eb);width:36px;height:36px;font-size:16px">📚</div>
                <div>
                  <div class="act-cc-title">${esc(c.name)}</div>
                  <div style="font-size:11.5px;color:#64748b;margin-top:2px">${level} ${tag}</div>
                </div>
              </div>
              <span class="act-cc-badge-count">
                👥 ${stCount} জন
              </span>
            </div>

            <div class="act-cc-footer">
              <span>বিস্তারিত রিপোর্ট ও টাকার হিসাব দেখুন</span>
              <span>➔</span>
            </div>
          </div>
        `;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function selectActivityCourse(courseName) {
      activityState.selectedCourse = courseName;
      activityState.currentView = 'course_detail';
      renderActivityCurrentView();
    }

    function goToActivityOverview() {
      activityState.currentView = 'overview';
      activityState.selectedCourse = null;
      renderActivityCurrentView();
    }

    function renderActivityCourseDetail(container) {
      const allCourses = activityState.data.courses || [];
      const allEnrollments = activityState.data.enrollments || [];
      const targetCourseName = activityState.selectedCourse || '';

      const courseObj = allCourses.find(c => String(c.name || '').toLowerCase().trim() === targetCourseName.toLowerCase().trim()) || { name: targetCourseName, level: '', tag: '' };

      // Filter enrollments for this specific course
      const courseAllEnrollments = allEnrollments.filter(e => String(e.course || '').toLowerCase().trim() === targetCourseName.toLowerCase().trim());

      // Filter by active date preset
      const filtered = filterActivityEnrollments(
        courseAllEnrollments,
        activityState.datePreset,
        activityState.customFrom,
        activityState.customTo
      );

      const enrolledCount = filtered.length;
      let totalCourseValue = 0;
      let totalDiscount = 0;
      let totalPaid = 0;
      let totalDue = 0;

      for (const e of filtered) {
        totalCourseValue += (e.coursePrice || 0);
        totalDiscount += (e.discount || 0);
        totalPaid += (e.paid || 0);
        totalDue += (e.due || 0);
      }

      const effectiveTotal = Math.max(0, totalCourseValue - totalDiscount);
      const collectionPct = effectiveTotal > 0
        ? Math.min(100, Math.round((totalPaid / effectiveTotal) * 100))
        : (totalPaid > 0 ? 100 : 0);

      const rangeLabel = getActivityDateRangeLabel(
        activityState.datePreset,
        activityState.customFrom,
        activityState.customTo
      );

      let html = `
        <!-- Breadcrumb / Back Navigation -->
        <div class="ac-breadcrumb-bar">
          <div class="ac-crumb-item" onclick="goToActivityOverview()">
            <span>🏠</span>
            <span>সকল কোর্স (Activity Overview)</span>
          </div>
          <span class="ac-crumb-sep">›</span>
          <div class="ac-crumb-item active">
            <span>📚</span>
            <span>${esc(courseObj.name)}</span>
          </div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
            <button type="button" class="btn ghost" style="padding:4px 10px;font-size:12px;height:auto" onclick="goToActivityOverview()">
              ← সকল কোর্সে ফিরে যান
            </button>
          </div>
        </div>

        ${renderActivityDateFilterBar()}

        <!-- Course Detailed Progress Report Card (Pure Analytics - No student list) -->
        <div class="act-report-card">
          <div class="act-report-head">
            <div style="display:flex;align-items:center;gap:10px">
              <div class="ac-user-avatar" style="background:linear-gradient(135deg,#10b981,#059669);width:40px;height:40px;font-size:18px">🎓</div>
              <div>
                <h2 style="margin:0;font-size:17px;font-weight:800;color:#0f172a">${esc(courseObj.name)}</h2>
                <div style="font-size:12px;color:#64748b;margin-top:2px">${esc(courseObj.level || '')} ${courseObj.tag ? '· ' + esc(courseObj.tag) : ''} · কোর্স অগ্রগতি রিপোর্ট</div>
              </div>
            </div>
            <span class="act-badge-range">${esc(rangeLabel)}</span>
          </div>

          <div class="act-stats-grid">
            <div class="act-stat-tile" style="border-top:3px solid #059669">
              <div class="act-stat-top">
                <span class="act-stat-label">ভর্তি শিক্ষার্থী সংখ্যা</span>
                <div class="act-stat-icon-wrap" style="background:#ecfdf5;color:#059669">👨‍🎓</div>
              </div>
              <div class="act-stat-number" style="color:#059669">${enrolledCount} জন</div>
            </div>

            <div class="act-stat-tile" style="border-top:3px solid #d97706">
              <div class="act-stat-top">
                <span class="act-stat-label">কোর্সের মোট মূল্য</span>
                <div class="act-stat-icon-wrap" style="background:#fef3c7;color:#d97706">💰</div>
              </div>
              <div class="act-stat-number">৳${acFmtMoney(totalCourseValue)}</div>
            </div>

            <div class="act-stat-tile" style="border-top:3px solid #16a34a">
              <div class="act-stat-top">
                <span class="act-stat-label">সংগৃহীত টাকা (Paid)</span>
                <div class="act-stat-icon-wrap" style="background:#f0fdf4;color:#16a34a">💵</div>
              </div>
              <div class="act-stat-number" style="color:#16a34a">৳${acFmtMoney(totalPaid)}</div>
            </div>

            <div class="act-stat-tile" style="border-top:3px solid #e11d48">
              <div class="act-stat-top">
                <span class="act-stat-label">বকেয়া টাকা (Due)</span>
                <div class="act-stat-icon-wrap" style="background:#fff1f2;color:#e11d48">⏳</div>
              </div>
              <div class="act-stat-number" style="color:${totalDue > 0 ? '#e11d48' : '#64748b'}">৳${acFmtMoney(totalDue)}</div>
            </div>

            <div class="act-stat-tile" style="border-top:3px solid #7c3aed">
              <div class="act-stat-top">
                <span class="act-stat-label">মোট ডিসকাউন্ট</span>
                <div class="act-stat-icon-wrap" style="background:#f5f3ff;color:#7c3aed">🏷️</div>
              </div>
              <div class="act-stat-number" style="color:#7c3aed">৳${acFmtMoney(totalDiscount)}</div>
            </div>
          </div>

          <!-- Collection Progress Bar for this Course -->
          <div class="act-progress-wrap">
            <div class="act-progress-labels">
              <span>অর্থ আদায় অগ্রগতি (Course Collection Rate)</span>
              <span>${collectionPct}% আদায় সম্পন্ন · ৳${acFmtMoney(totalPaid)} / ৳${acFmtMoney(effectiveTotal)}</span>
            </div>
            <div class="act-progress-track">
              <div class="act-progress-fill-paid" style="width: ${collectionPct}%"></div>
              <div class="act-progress-fill-due" style="width: ${100 - collectionPct}%"></div>
            </div>
          </div>

          <!-- Summary Note Card -->
          <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;font-size:13px;color:#334155;line-height:1.6">
            📌 <strong>সারসংক্ষেপ:</strong> 
            নির্বাচিত সময়কালে (<strong>${esc(rangeLabel)}</strong>) এই কোর্সে সর্বমোট <strong>${enrolledCount} জন</strong> শিক্ষার্থী ভর্তি হয়েছেন। মোট কোর্সের মূল্য <strong>৳${acFmtMoney(totalCourseValue)}</strong>-এর মধ্যে ডিসকাউন্ট দেওয়া হয়েছে <strong>৳${acFmtMoney(totalDiscount)}</strong>। বর্তমানে সংগৃহীত হয়েছে <strong>৳${acFmtMoney(totalPaid)}</strong> এবং অবশিষ্ট বকেয়া রয়েছে <strong>৳${acFmtMoney(totalDue)}</strong>।
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    if (S.token && S.user) {
      show();
    } else {
      const appEl = document.getElementById('app');
      const loginEl = document.getElementById('login');
      if (appEl) appEl.classList.add('hidden');
      if (loginEl) loginEl.classList.remove('hidden');
    }

  </script>
</body>

</html>
