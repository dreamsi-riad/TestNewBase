:root{--i:#17233f;--m:#68748d;--p:#f5f7fb;--w:#fff;--l:#e4e8ef;--g:#e8a33d;--r:#d9534f;--ok:#20875a}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:'Anek Bangla',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.panel,.stat{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 14px 40px #17233f12}.box{width:min(430px,100%);padding:32px}.brand{font:800 28px 'Baloo Da 2'}.brand span{color:var(--g)}label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}input,textarea{width:100%;border:1px solid var(--l);border-radius:10px;padding:10px 12px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:var(--i);color:#fff}.gold{background:var(--g);color:var(--i)}.ghost{background:#fff;border:1px solid var(--l)}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#101a31;color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}.side nav button{display:block;width:100%;border:0;background:transparent;color:#cbd3e5;text-align:left;padding:10px 12px;border-radius:9px;margin:3px 0}.side nav button:hover,.side nav button.active{background:#263657;color:#fff}.muted{color:var(--m)}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;padding:0 22px;position:sticky;top:0;z-index:5}.content{padding:22px;max-width:1700px;margin:auto}.title{font:800 30px 'Baloo Da 2';margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:17px;text-align:left}.stat .n{font-size:28px;font-weight:800}.panel{overflow:hidden;margin-top:16px}.ph{padding:14px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.tools,.act{display:flex;gap:7px;flex-wrap:wr .compact-link{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:#eef5ff;color:#1769df;text-decoration:none;font-size:17px;font-weight:800}
.compact-link:hover{background:#dfeeff}
.tbl .actions-cell{vertical-align:middle}.tbl th{background:#fafbfc}.mini{border:1px solid var(--l);background:#fff;border-radius:8px;padding:5px 8px;font-weight:700}.mini.ok{background:#eaf8f0;color:var(--ok)}.mini.bad{background:#fff0ef;color:var(--r)}.empty{padding:40px;text-align:center;color:var(--m)}.pager{padding:11px 15px;display:flex;justify-content:space-between}.drawer{position:fixed;inset:0;background:#0b1428aa;display:flex;justify-content:flex-end;z-index:20}.drawer>div{width:min(680px,100%);height:100%;overflow:auto;background:#fff;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.toast{position:fixed;right:20px;bottom:20px;background:var(--i);color:#fff;padding:10px 14px;border-radius:9px;z-index:30}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.side nav{display:flex;overflow:auto}.side nav button{min-width:max-content}.content{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:520px){.cards{grid-template-columns:1fr}}

.small{font-size:12px}.secret{letter-spacing:2px;color:#8b94a8}.cell-link{color:#1c63d5;text-decoration:none;font-weight:600}.cell-link:hover{text-decoration:underline}
.badge{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#f1f3f6;color:#68748d}.badge.on{background:#eaf8f0;color:#20875a}.badge.off{background:#fff0ef;color:#d9534f}
.tbl th{position:sticky;top:0;z-index:2;white-space:nowrap}.tbl td{line-height:1.25}.actions-head,.actions-cell{min-width:190px;position:sticky;right:0;background:#fff;z-index:3}.tbl th.actions-head{background:#fafbfc}.act{min-width:180px}.mini:disabled{opacity:.45;cursor:not-allowed}.error-box{color:#d9534f;background:#fff8f8;border:1px solid #ffd6d3;margin:16px;border-radius:12px}
.drawer select{width:100%;border:1px solid var(--l);border-radius:10px;padding:10px 12px;background-color:#fff}
.status-spinner{-webkit-appearance:none;appearance:none;width:100%;font-size:15px;font-weight:700;text-align:center;padding:14px 12px;border-radius:999px;border:1.5px solid var(--l);background-color:#fff;background-repeat:no-repeat !important;background-position:right 14px center !important;background-size:14px 14px !important;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2368748d" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');cursor:pointer}
.status-spinner[data-val="Pending"]{color:#a06b00;background-color:#fff6e0;border-color:#f0d38a}

.access-spinner{-webkit-appearance:none;appearance:none;width:100%;font-size:13.5px;font-weight:700;padding:10px 36px 10px 14px;border-radius:12px;border:1.5px solid #cbd5e1;background-color:#fff;background-repeat:no-repeat !important;background-position:right 14px center !important;background-size:14px 14px !important;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>');color:#0f172a;cursor:pointer;transition:all .2s ease;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.access-spinner:hover{border-color:#94a3b8}

.access-spinner[data-val="Limited Access"]{background-color:#fffbeb !important;border-color:#fcd34d !important;color:#b45309 !important;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23b45309" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>') !important}
.access-spinner[data-val="Full Access"]{background-color:#ecfdf5 !important;border-color:#86efac !important;color:#047857 !important;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23047857" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>') !important}
.field-type{font-size:10px;color:#8a94a8;font-weight:600;margin-left:5px}.field-note{font-size:11px;color:#d9534f}.editor-meta{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:#f7f9fc;border-radius:10px;margin-bottom:12px}.editor-meta span{font-size:12px;color:#68748d}.drawer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--l)}
.spinner{width:24px;height:24px;border:3px solid #e4e8ef;border-top-color:#17233f;border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.smooth-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:34px;text-align:center;color:var(--m)}
.search-wrap{position:relative;width:240px}
.search-wrap input{width:100%;padding-right:38px;transition:border-color .2s,box-shadow .2s}
.search-wrap input:focus{border-color:#68748d;box-shadow:0 0 0 3px #17233f10;outline:none}
.search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#8b94a8;font-size:18px;line-height:1;padding:4px;display:none}
.search-clear.show{display:block}
.search-status{font-size:11px;color:#8b94a8;margin-top:3px}
.panel.is-loading{opacity:.72;pointer-events:none;transition:opacity .18s ease}
.panel{transition:opacity .18s ease,transform .18s ease}
.tbl tbody tr{transition:background .15s ease}

.content{animation:contentIn .2s ease-out}@keyframes contentIn{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}
.modal-overlay{position:fixed;inset:0;background:#0b1428aa;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-box{background:#fff;border-radius:16px;padding:26px;width:min(420px,100%);box-shadow:0 20px 60px #17233f22}
.modal-box h3{margin:0 0 4px;font:800 21px 'Baloo Da 2'}
.modal-box .muted{margin:0 0 14px;font-size:13px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--l)}
.approve-info{display:flex;flex-direction:column;gap:5px;padding:11px 16px;background:linear-gradient(135deg,#eef5ff,#f5f9ff);border:1px solid #cfe0ff;border-radius:14px;margin-bottom:16px}
.approve-info .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.approve-info .lbl{font-size:11px;font-weight:800;color:#4a5d85;text-transform:uppercase;letter-spacing:.5px;background:#dfeaff;padding:4px 9px;border-radius:999px;min-width:92px;text-align:center}
.approve-info .val{font-size:17px;font-weight:800;color:#101a31}
.approve-info .val.course{color:#d9534f}
.approve-info .row.price{margin-top:5px;padding-top:7px;border-top:1px dashed #c3d7fb}
.approve-info .row.price .lbl{background:#fdeccb;color:#8a5a00}
.approve-info .row.price .val{color:#b5760b;font-size:22px;font-family:'Baloo Da 2',sans-serif}

/* ============================================================
   PREMIUM ENROLLMENTS & STUDENTS TABLE DESIGN SUITE
   ============================================================ */

/* Filter bar & Course selector */
.filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 14px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 16px;box-shadow:0 4px 14px rgba(15,23,42,.03)}
.filter-bar label{margin:0;font-size:13px;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:6px}
.filter-bar select{border:1.5px solid #cbd5e1;border-radius:10px;padding:8px 14px;background:#f8fafc;color:#0f172a;min-width:280px;font-weight:700;font-size:13.5px;transition:all .2s ease;cursor:pointer}
.filter-bar select:focus{border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}
.filter-count{font-size:12.5px;font-weight:700;color:#64748b;margin-left:auto}

/* Elevated Table Card */
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 30px -5px rgba(15,23,42,.05),0 2px 6px rgba(15,23,42,.02);overflow:hidden;margin-top:10px}
.ph{padding:14px 20px;border-bottom:1px solid #edf2f7;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ph-title-wrap{display:flex;align-items:center;gap:10px}
.ph-title{font:800 19px 'Baloo Da 2',sans-serif;color:#0f172a;margin:0}
.ph-count-pill{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe}
.ph-sub{font-size:12.5px;color:#64748b;margin-top:2px}

/* Modern Search Box */
.search-wrap{position:relative;min-width:260px}
.search-wrap input{width:100%;padding:9px 36px 9px 34px;border:1.5px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-size:13px;font-weight:600;color:#0f172a;transition:all .2s ease}
.search-wrap input:focus{border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12);outline:none}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none;display:flex}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#94a3b8;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;cursor:pointer;display:none}
.search-clear:hover{color:#0f172a}
.search-clear.show{display:block}

/* Header Refresh & Actions */
.btn-refresh{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:#334155;cursor:pointer;transition:all .2s ease}
.btn-refresh:hover{background:#f8fafc;border-color:#94a3b8;color:#0f172a;transform:translateY(-1px)}
.btn-refresh svg{transition:transform .35s ease}
.btn-refresh:hover svg{transform:rotate(180deg)}

/* Table & Cells */
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}
.tbl th{background:#f8fafc;color:#475569;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:12px 14px;border-bottom:1px solid #e2e8f0;white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl td{padding:12px 14px;border-bottom:1px solid #f1f5f9;font-size:13.5px;color:#1e293b;vertical-align:middle;line-height:1.4}
.tbl tbody tr{transition:background .15s ease;cursor:pointer}
.tbl tbody tr:hover{background:#f8faff}
.tbl tbody tr:last-child td{border-bottom:0}

/* Enrollments Table specific */
.tbl.enroll-tbl{min-width:980px}
.tbl.enroll-tbl td,.tbl.enroll-tbl th{max-width:none;width:auto;white-space:nowrap}
.tbl.enroll-tbl td.wrap{white-space:normal;max-width:220px}
.tbl.enroll-tbl td.actions-cell{cursor:default}

/* Student Avatar Cell */
.adm-user-cell{display:flex;align-items:center;gap:11px}
.adm-avatar-circle{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;flex-shrink:0;box-shadow:0 3px 8px rgba(15,23,42,.12);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.adm-user-info{min-width:0}
.adm-user-name{font-weight:800;color:#0f172a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.adm-user-sub{font-size:12px;color:#64748b;margin-top:2px}
.adm-user-sub a{color:#64748b;text-decoration:none}
.adm-user-sub a:hover{color:#1d4ed8;text-decoration:underline}

/* Course Pill & Sector */
.adm-course-cell{max-width:260px}
.adm-course-title{font-weight:800;color:#1e40af;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-sector-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.3px;line-height:1}
.adm-sector-pill.nu{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.adm-sector-pill.dcu{background:#f5f3ff;color:#6d28d9;border:1px solid #ede9fe}
.adm-sector-pill.other{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}

/* Price & Discount Pill */
.adm-price-val{font-weight:800;color:#0f172a;font-size:14px}
.adm-dis-pill{display:inline-block;font-size:11px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fef3c7;padding:1px 6px;border-radius:5px;margin-top:2px}

/* Due Badges */
.adm-due-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;line-height:1}
.adm-due-badge.due-unpaid{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.adm-due-badge.due-paid{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.adm-due-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;display:inline-block;animation:duePulse 2s infinite}
@keyframes duePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}

/* Academic Chips for Students */
.adm-chips-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.adm-chip{display:inline-flex;align-items:center;padding:2.5px 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;white-space:nowrap}
.adm-chip.level{background:#eff6ff;color:#1e40af;border-color:#dbeafe}
.adm-chip.year{background:#fdf4ff;color:#86198f;border-color:#f5d0fe}
.adm-chip.session{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}

/* Contact Links */
.adm-contact-link{display:inline-flex;align-items:center;gap:5px;color:#1e293b;text-decoration:none;font-weight:600;font-size:13px;transition:color .15s ease}
.adm-contact-link:hover{color:#2563eb;text-decoration:underline}
.adm-contact-link.email{font-family:monospace;font-size:12.5px;color:#475569}

/* Student Phone Copy Button & Wrappers */
.adm-copy-phone-btn{display:inline-flex;align-items:center;gap:4.5px;padding:2.5px 7.5px;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;line-height:1.2;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);vertical-align:middle;user-select:none;flex-shrink:0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.adm-copy-phone-btn svg{flex-shrink:0;transition:transform .18s ease}
.adm-copy-phone-btn:hover{background:#e2e8f0;color:#0f172a;border-color:#94a3b8;transform:translateY(-1px);box-shadow:0 2px 5px rgba(15,23,42,.08)}
.adm-copy-phone-btn:active{transform:translateY(0) scale(.97)}
.adm-copy-phone-btn.copied{background:#ecfdf5 !important;color:#059669 !important;border-color:#10b981 !important;box-shadow:0 0 0 3px rgba(16,185,129,.22),0 2px 6px rgba(16,185,129,.15) !important;animation:copyPulse .32s cubic-bezier(.175,.885,.32,1.275)}
.adm-copy-phone-btn.copied svg{color:#059669 !important;transform:scale(1.15)}
@keyframes copyPulse{0%{transform:scale(.94)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.adm-phone-field{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.adm-phone-badge{display:inline-flex;align-items:center;gap:6px;background:#f8fafc;padding:2px 7px;border-radius:8px;border:1px solid #e2e8f0}
.adm-phone-wrap{display:inline-flex;align-items:center;gap:6px}
.ap-student-wrap{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Next Date Badge */
.adm-date-badge{display:inline-flex;align-items:center;gap:5px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;color:#334155}

/* Action Buttons */
.act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adm-act-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:#334155;cursor:pointer;transition:all .18s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 3px rgba(15,23,42,.04);white-space:nowrap}
.adm-act-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(15,23,42,.08)}
.adm-act-btn.act-view{border-color:#bfdbfe;color:#1d4ed8;background:#eff6ff}
.adm-act-btn.act-view:hover{border-color:#3b82f6;background:#dbeafe}
.adm-act-btn.act-edit:hover{border-color:#3b82f6;color:#1d4ed8;background:#eff6ff}
.adm-act-btn.act-pw{border-color:#e2e8f0;background:#faf5ff;color:#6b21a8}
.adm-act-btn.act-pw:hover{border-color:#c084fc;background:#f3e8ff}
.adm-act-btn.act-lock{border-color:#cbd5e1;color:#475569}
.adm-act-btn.act-lock:hover{border-color:#94a3b8;background:#f1f5f9}
.adm-act-btn.act-locked{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
.adm-act-btn.act-locked:hover{background:#fee2e2}
.adm-act-btn.act-wt-on{background:#ecfdf5;border-color:#86efac;color:#047857}
.adm-act-btn.act-wt-on:hover{background:#d1fae5}

async function copyStudentNumber(btn, ev){
  if(ev){
    try{ev.stopPropagation();}catch(e){}
    try{ev.preventDefault();}catch(e){}
  }
  const cleanNumber=String(btn?.dataset?.phone||'').trim();
  if(!cleanNumber)return;
  let success=false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(cleanNumber);
      success=true;
    }else{
      throw new Error('Fallback needed');
    }
  }catch(err){
    try{
      const ta=document.createElement('textarea');
      ta.value=cleanNumber;
      ta.style.position='fixed';
      ta.style.left='-9999px';
      ta.style.top='-9999px';
      ta.setAttribute('readonly','');
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      success=document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){
      success=false;
    }
  }
  if(success && btn){
    btn.classList.add('copied');
    const origHtml=btn.dataset.origHtml||btn.innerHTML;
    btn.dataset.origHtml=origHtml;
    btn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>Copied!</span>`;

    },2000);

    toast('কপি করা যায়নি');
  }
}

  };

    method:'POST',

  return j;
}

function getAvatarBg(str){
  const colors=[
    'linear-gradient(135deg, #3b82f6, #1d4ed8)',
    'linear-gradient(135deg, #8b5cf6, #6d28d9)',
    'linear-gradient(135deg, #06b6d4, #0891b2)',
    'linear-gradient(135deg, #10b981, #059669)',
    'linear-gradient(135deg, #f59e0b, #d97706)',
    'linear-gradient(135deg, #ec4899, #be185d)',
    'linear-gradient(135deg, #6366f1, #4338ca)'
  ];
  let hash=0;
  for(let i=0;i<(str||'').length;i++) hash = (hash << 5) - hash + str.charCodeAt(i);
  return colors[Math.abs(hash) % colors.length];
}
function getInitial(str){
  const s=String(str||'').trim();
  return s ? s.charAt(0).toUpperCase() : 'S';
}

function colName(c){
  if(typeof c==='string') return c;
  if(!c || typeof c!=='object') return '';
  return String(c.name ?? c.column_name ?? c.key ?? c.columnName ?? '');
}
function colType(c){
  if(!c || typeof c!=='object') return 'TEXT';
  return String(c.type ?? 'TEXT').toUpperCase();
}
function cellValue(v){
  if(v===null || v===undefined) return '';
  if(typeof v==='object'){
    try{return JSON.stringify(v);}
    catch{return '[Object]';}
  }
  return String(v);
}
function isDateColumn(name){
  return /(^|_)(date|timestamp|created_at|updated_at|enrolled_at|expires_at|next_date|last_attempt_at)($|_)/i.test(String(name||''));
}
function formatDateOnly(value){
  const raw=String(value??'').trim();
  if(!raw) return '';
  const match=/^(\d{4}-\d{2}-\d{2})/.exec(raw);
  return match ? match[1] : raw.split('T')[0];
}
function formatNextPaymentDate(value){
  const raw=String(value??'').trim();
  if(!raw) return '';
  const slash=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec(raw);
  if(slash) return raw;
  const iso=/^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
  return iso ? `${iso[1]}/${iso[2]}/${iso[3]}` : raw.split('T')[0].replace(/-/g,'/');
}
function shortValue(v,max=180){
  const s=cellValue(v);
  return s.length>max ? s.slice(0,max-1)+'…' : s;
}
function isSecretColumn(c){
  return /^(password|active_token|token|secret)$/i.test(colName(c));
}
function isLargeColumn(c){
  const n=colName(c);
  return /description|long_description|text|address|url|link|feature|chapter|class|content|details|note|message|json|data|image/i.test(n);
}
function inputValue(v){
  return cellValue(v);
}
function renderCell(v,c){
  const name=colName(c);
  if(isSecretColumn(c)) return '<span class="secret">••••••••</span>';
  const previewMax=isLargeColumn(c)?55:180;
  const raw=shortValue(v,previewMax);
  const s=isDateColumn(name)?formatDateOnly(raw):raw;
  if(!s) return '<span class="muted">—</span>';
  if(/^https?:\/\//i.test(s)){
    const safe=esc(s);
    return `<a class="compact-link" href="${safe}" target="_blank" rel="noopener noreferrer" title="${safe}" aria-label="Open link">↗</a>`;
  }
  if(/^(true|false|yes|no)$/i.test(s.trim())){
    const on=/^(true|yes)$/i.test(s.trim());
    return `<span class="badge ${on?'on':'off'}">${esc(s)}</span>`;
  }

function moneyNumber(v){
  const s=cellValue(v).replace(/[^\d.\-]/g,'').trim();
  if(!s)return null;
  const n=Number(s);
  return isFinite(n)?n:null;
}
function fmtMoney(n){
  if(n===null||n===undefined)return '';
  return (Math.round(n*100)/100).toLocaleString('en-US');
}
function dueAmount(row){
  const price=moneyNumber(row.course_price);
  if(price===null)return null;
  const discount=moneyNumber(row.discount)||0;
  const paid=moneyNumber(row.paid)||0;
  return price-discount-paid;
}

          <button class="pager-btn" ${offset+limit>=total?'disabled':''} onclick="localPage(1)">পরবর্তী →</button>

  if(isSearchActive){

async function fetchRows(isTyping=false){
  const q=document.getElementById('panel');
  if(!q)return;

  const requestId=++refreshSeq;
  if(!isTyping && !q.querySelector('.tbl')){
    q.innerHTML='<div class="smooth-loading"><div class="spinner"></div><div>ডাটাবেজ লোড হচ্ছে…</div><div class="search-status">Cloudflare D1 থেকে লাইভ ডাটা লোড হচ্ছে</div></div>';
  }

  try{
    const response=await api('admin_rows',{
      table:S.table,
      search:S.search,
      offset:S.offset,
      limit:S.limit,
      course:S.courseFilter||''
    });
    if(requestId!==refreshSeq)return;

    const d=response.data||{};
    S.rows=Array.isArray(d.rows)?d.rows:[];
    S.total=Number(d.total??S.rows.length);
    if(Array.isArray(d.columns)&&d.columns.length){
      S.cols=d.columns;
    }
    if(isEnrollTable()&&Array.isArray(d.courses)){
      populateCourseFilter(d.courses);
    }
    renderTable(d);
  }catch(e){
    if(requestId!==refreshSeq)return;
    q.innerHTML=`<div class="empty error-box"><b>Could not load this table</b><br>${esc(e.message||e)}</div>`;
  }
}

async function refresh(resetPaging=false){
  if(resetPaging){
    S.search='';
    S.offset=0;
    const input=document.getElementById('search');
    if(input)input.value='';
  }
  await fetchRows();
}

function localPage(direction){
  const total=S.total||0;
  const newOffset=Math.max(0,Math.min(S.offset+direction*S.limit,Math.max(0,total-S.limit)));
  if(newOffset===S.offset && total<=S.limit)return;
  S.offset=newOffset;
  fetchRows();
}

function changePageLimit(val){
  S.limit = Number(val) || 50;
  S.offset = 0;
  fetchRows();
}

function enrollDateInputValue(name,v){
  if(!v)return '';

  const nextDate=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec(raw);
  const d=nextDate
    ? new Date(Number(nextDate[1]),Number(nextDate[2])-1,Number(nextDate[3]))
    : new Date(raw);
  if(isNaN(d.getTime()))return '';
  return d.toISOString().slice(0,10);
}

async function save(e){
  e.preventDefault();
  const d={};
  document.querySelectorAll('#ef [data-c]').forEach(x=>{
    if(x.disabled||x.readOnly)return;
    if(x.dataset.enrollDate){
      if(!x.value){d[x.dataset.c]='';return;}
      d[x.dataset.c]=x.dataset.c==='next_date'
        ? fmtDateInput(x.value)
        : new Date(x.value+'T23:59:59.999Z').toISOString();
      return;
    }
    d[x.dataset.c]=x.value;
  });
  if(isEnrollTable()){
    const ridVal=Number(document.getElementById('rid').value)||0;
    const oldRow=S.rows.find(x=>Number(x.__rowid)===ridVal);
    if(oldRow){
      const addStr=String(d.paid??'').replace(/[^\d.]/g,'').trim();
      if(addStr&&Number(addStr)>0){
        const add=Number(addStr);
        const oldPaid=moneyNumber(oldRow.paid)||0;
        d.paid=String(oldPaid+add);
        let hist=[];
        try{const raw=cellValue(oldRow.payment_history).trim();if(raw){const p=JSON.parse(raw);if(Array.isArray(p))hist=p;}}catch{}
        const now=new Date();
        const dateStr=now.toISOString();
        hist.push({date:dateStr,amount:add,admin:String(S.user?.name||'Admin').trim()||'Admin'});
        d.payment_history=JSON.stringify(hist);
      }else{
        delete d.paid;
      }
    }
  }
  try{
    await api('admin_save',{table:S.table,rowid:Number(rid.value)||0,data:d});
    pageCache.delete(cacheKey());
    toast('Saved successfully');
    closeDrawer();
    refresh();
  }catch(e){toast(e.message||'Save failed')}
}

  try{

    if(S.offset>0 && S.rows.length===1)S.offset=Math.max(0,S.offset-S.limit);

function ccGetUniqueCourses(){
  const s = new Set();
  (ccState.rows || []).forEach(r => {
    const v = String(r.course_name || '').trim();
    if(v) s.add(v);
  });
  return Array.from(s).sort((a,b) => a.localeCompare(b));
}

function ccGetUniqueSubjects(courseName){
  const s = new Set();
  const target = String(courseName || '').trim().toLowerCase();
  (ccState.rows || []).forEach(r => {
    if(target && String(r.course_name || '').trim().toLowerCase() !== target) return;
    const v = String(r.subject || '').trim();
    if(v) s.add(v);
  });
  return Array.from(s).sort((a,b) => a.localeCompare(b));
}

function ccGetUniqueChapters(courseName, subjectName){
  const s = new Set();
  const targetC = String(courseName || '').trim().toLowerCase();
  const targetS = String(subjectName || '').trim().toLowerCase();
  (ccState.rows || []).forEach(r => {
    if(targetC && String(r.course_name || '').trim().toLowerCase() !== targetC) return;
    if(targetS && String(r.subject || '').trim().toLowerCase() !== targetS) return;
    const v = String(r.chapter || '').trim();
    if(v) s.add(v);
  });
  return Array.from(s).sort((a,b) => a.localeCompare(b));
}

async function ccSaveClass(andNext = true){
  const course = ccState.isNewCourse
    ? (document.getElementById('ccCourseInput')?.value.trim() || '')
    : (document.getElementById('ccCourseSelect')?.value.trim() || '');

  const subject = ccState.isNewSubject
    ? (document.getElementById('ccSubjectInput')?.value.trim() || '')
    : (document.getElementById('ccSubjectSelect')?.value.trim() || '');

  const chapter = ccState.isNewChapter
    ? (document.getElementById('ccChapterInput')?.value.trim() || '')
    : (document.getElementById('ccChapterSelect')?.value.trim() || '');

  const className = document.getElementById('ccClassName')?.value.trim() || '';
  const url = document.getElementById('ccUrl')?.value.trim() || '';
  const pdfUrl = document.getElementById('ccPdfUrl')?.value.trim() || '';

  if(!course){
    toast('অনুগ্রহ করে কোর্সের নাম দিন');
    if(ccState.isNewCourse) document.getElementById('ccCourseInput')?.focus();
    else document.getElementById('ccCourseSelect')?.focus();
    return;
  }
  if(!subject){
    toast('অনুগ্রহ করে সাবজেক্টের নাম দিন');
    if(ccState.isNewSubject) document.getElementById('ccSubjectInput')?.focus();
    else document.getElementById('ccSubjectSelect')?.focus();
    return;
  }
  if(!chapter){
    toast('অনুগ্রহ করে চ্যাপ্টারের নাম দিন');
    if(ccState.isNewChapter) document.getElementById('ccChapterInput')?.focus();
    else document.getElementById('ccChapterSelect')?.focus();
    return;
  }
  if(!className){
    toast('অনুগ্রহ করে ক্লাসের নাম দিন (যেমন: 1st class DCU)');
    document.getElementById('ccClassName')?.focus();
    return;
  }
  if(!url){
    toast('অনুগ্রহ করে ভিডিও লিংক দিন (YouTube / Video URL)');
    document.getElementById('ccUrl')?.focus();
    return;
  }

  const btn = document.getElementById('ccBtnSaveNext');
  const prevText = btn ? btn.innerHTML : '';
  if(btn){
    btn.disabled = true;
    btn.innerHTML = 'সেভ হচ্ছে…';
  }

  try{
    const res = await api('admin_save', {
      table: ccState.activeTable,
      rowid: 0,
      data: {
        course_name: course,
        subject: subject,
        chapter: chapter,
        class_name: className,
        url: url,
        pdf_url: pdfUrl
      }
    });

    const newRowId = res.rowid || Date.now();
    const newRow = {
      __rowid: newRowId,
      course_name: course,
      subject: subject,
      chapter: chapter,
      class_name: className,
      url: url,
      pdf_url: pdfUrl
    };

    // Add to local state (at beginning so it is immediately visible)
    ccState.rows.unshift(newRow);
    pageCache.delete(ccState.activeTable);

    // Ensure selected state
    ccState.course = course;
    ccState.subject = subject;
    ccState.chapter = chapter;

    // Reset new-mode flags if newly typed
    if(ccState.isNewCourse) ccToggleNewCourse();
    if(ccState.isNewSubject) ccToggleNewSubject();
    if(ccState.isNewChapter) ccToggleNewChapter();

    ccPopulateDropdowns();
    ccUpdateStats();
    ccRenderTable();

    // Clear class inputs
    document.getElementById('ccClassName').value = '';
    document.getElementById('ccUrl').value = '';
    document.getElementById('ccPdfUrl').value = '';

    if(andNext){
      toast('✅ ক্লাস সেভ হয়েছে! পরবর্তী ক্লাস দিন।');
      document.getElementById('ccClassName')?.focus();
    }else{
      toast('✅ ক্লাস সফলভাবে সেভ হয়েছে!');
    }
  }catch(err){
    toast(err.message || 'ক্লাস সেভ করতে সমস্যা হয়েছে');
  }finally{
    if(btn){
      btn.disabled = false;
      btn.innerHTML = prevText;
    }
  }
}

function ccRenderTable(){
  const body = document.getElementById('ccTableBody');
  const countEl = document.getElementById('ccVisibleCount');
  if(!body) return;

  const targetCourse = String(ccState.filterCourse || '').trim().toLowerCase();
  const targetSubject = String(ccState.filterSubject || '').trim().toLowerCase();
  const targetChapter = String(ccState.filterChapter || '').trim().toLowerCase();
  const q = String(ccState.search || '').trim().toLowerCase();

  const filtered = ccState.rows.filter(r => {
    if(targetCourse && String(r.course_name || '').trim().toLowerCase() !== targetCourse) return false;
    if(targetSubject && String(r.subject || '').trim().toLowerCase() !== targetSubject) return false;
    if(targetChapter && String(r.chapter || '').trim().toLowerCase() !== targetChapter) return false;
    if(q){
      const match = [r.course_name, r.subject, r.chapter, r.class_name, r.url, r.pdf_url]
        .some(val => String(val || '').toLowerCase().includes(q));
      if(!match) return false;
    }
    return true;
  });

  if(countEl) countEl.textContent = `প্রদর্শিত ক্লাস: ${filtered.length} টি`;

  if(!filtered.length){
    body.innerHTML = `<tr><td colspan="7" class="empty">কোনো ক্লাস পাওয়া যায়নি। উপরে ফরম ব্যবহার করে দ্রুত ক্লাস যোগ করুন।</td></tr>`;
    return;
  }

  body.innerHTML = filtered.map((r, i) => {
    const rowId = r.__rowid || r.rowid || r.id;
    const url = String(r.url || '').trim();
    const pdf = String(r.pdf_url || '').trim();

    const videoBtn = url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="cc-link-btn cc-link-video" title="${esc(url)}">▶ ভিডিও দেখুন ↗</a>`
      : `<span class="muted">—</span>`;

    const pdfBtn = pdf
      ? `<a href="${esc(pdf)}" target="_blank" rel="noopener" class="cc-link-btn cc-link-pdf" title="${esc(pdf)}">📄 শিট / PDF ↗</a>`
      : `<span class="muted">—</span>`;

    return `<tr>
      <td style="font-weight:800;color:#64748b;font-size:12px">#${i + 1}</td>
      <td><div style="font-weight:700;color:#1e40af;font-size:13px">${esc(r.course_name || '—')}</div></td>
      <td><div style="font-weight:700;color:#0f172a">${esc(r.subject || '—')}</div></td>
      <td><span style="font-weight:600;color:#475569;background:#f1f5f9;padding:2px 8px;border-radius:6px;font-size:12px">${esc(r.chapter || '—')}</span></td>
      <td><div style="font-weight:800;color:#0f172a;font-size:13.5px">${esc(r.class_name || '—')}</div></td>
      <td>${videoBtn}</td>
      <td>${pdfBtn}</td>
      <td class="actions-cell">
        <div class="act">
          <button type="button" class="adm-act-btn act-edit" onclick="openCcEditModal(${rowId})" title="এডিট করুন">✏ Edit</button>
          <button type="button" class="adm-act-btn act-del" onclick="deleteCcClass(${rowId})" title="ডিলিট করুন">🗑 Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function ccSwitchLevel(tableId){
  ccState.activeTable = tableId;
  ccState.course = '';
  ccState.subject = '';
  ccState.chapter = '';
  ccState.filterCourse = '';
  ccState.filterSubject = '';
  ccState.filterChapter = '';
  ccState.search = '';

  // 1. Highlight clicked level button immediately
  document.querySelectorAll('.cc-level-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.table === tableId);
  });

  const curLevel = CC_LEVELS.find(l => l.id === tableId) || { name: tableId, icon: '📚' };
  const mainArea = document.getElementById('ccMainArea');

  // 2. Immediately show clean loading screen with animated spinner (NO old content flash!)
  if(mainArea){
    mainArea.innerHTML = `
      <div class="cc-loading-screen">
        <div class="cc-pulse-spinner"></div>
        <div style="font:800 22px 'Baloo Da 2',sans-serif;color:#0f172a;margin-bottom:4px">
          ${curLevel.icon} ${esc(curLevel.name)} এর ডাটাবেজ লোড হচ্ছে…
        </div>
        <div style="font-size:13px;color:#64748b">
          Cloudflare D1 থেকে ক্লাস, সাবজেক্ট ও চ্যাপ্টারের তথ্য প্রস্তুত করা হচ্ছে
        </div>
      </div>
    `;
  }

  // 3. Fetch from API
  try{
    const res = await api('admin_rows', {
      table: tableId,
      search: '',
      offset: 0,
      limit: 1000000
    });
    const d = res.data || {};
    ccState.rows = Array.isArray(d.rows) ? d.rows : [];
    pageCache.set(tableId, { allRows: ccState.rows, loadedAt: Date.now() });
  }catch(err){
    toast(`ডাটাবেজ লোড ব্যর্থ: ${err.message || err}`);
    ccState.rows = [];
  }

  // 4. Update level badge count
  const activeBtn = document.querySelector(`.cc-level-btn[data-table="${tableId}"] .cc-badge-count`);
  if(activeBtn) activeBtn.textContent = ccState.rows.length;

  // 5. Pre-select first course, subject, chapter if available
  const courses = ccGetUniqueCourses();
  if(courses.length > 0){
    ccState.course = courses[0];
    const subjects = ccGetUniqueSubjects(ccState.course);
    if(subjects.length > 0){
      ccState.subject = subjects[0];
      const chapters = ccGetUniqueChapters(ccState.course, ccState.subject);
      if(chapters.length > 0){
        ccState.chapter = chapters[0];
      }
    }
  }

  // 6. Smoothly render the full studio into ccMainArea
  renderLoadedStudio(curLevel);
}
