<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION Academics — অ্যাডমিন প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Anek+Bangla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A47;
  --ink-soft:#4A5772;
  --paper:#FAF7F0;
  --paper-line:#E7DFCB;
  --card:#FFFFFF;
  --accent:#E8A33D;
  --accent-dark:#C97F1F;
  --margin:#C84B4B;
  --sky:#5B8FBF;
  --green:#4C8C6B;
  --shadow:0 10px 30px rgba(30,42,71,0.08);
  --radius:14px;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:'Anek Bangla', sans-serif;
}
h1,h2,h3,.brand,button{ font-family:'Baloo Da 2', sans-serif; }
button{ cursor:pointer; font-family:inherit; }

/* ---------- LOGIN SCREEN ---------- */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:32px 28px;
}
.login-card .brand{
  font-size:22px;
  font-weight:700;
  color:var(--ink);
  margin:0 0 4px;
}
.login-card .sub{
  font-size:14px;
  color:var(--ink-soft);
  margin:0 0 24px;
}
.field{ margin-bottom:16px; }
.field label{
  display:block;
  font-size:13px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--paper-line);
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
  background:var(--paper);
  color:var(--ink);
}
.field input:focus{ outline:2px solid var(--sky); outline-offset:1px; }
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:13px 18px;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  background:var(--accent);
  color:var(--ink);
  transition:transform .15s ease, background .15s ease;
}
.btn:hover{ background:var(--accent-dark); color:#fff; }
.btn:active{ transform:scale(.98); }
.btn-outline{
  background:transparent;
  border:1px solid var(--paper-line);
  color:var(--ink-soft);
}
.btn-outline:hover{ background:var(--paper); color:var(--ink); }
.btn-danger{ background:var(--margin); color:#fff; }
.btn-danger:hover{ background:#a83a3a; }
.btn-green{ background:var(--green); color:#fff; }
.btn-green:hover{ background:#3c7256; }
.error-text{
  color:var(--margin);
  font-size:13px;
  margin:-6px 0 14px;
  min-height:16px;
}

/* ---------- APP SHELL ---------- */
#app{ display:none; min-height:100vh; }
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  background:var(--card);
  border-bottom:1px solid var(--paper-line);
  position:sticky;
  top:0;
  z-index:10;
}
.topbar .brand{ font-size:18px; font-weight:700; }
.topbar-right{ display:flex; align-items:center; gap:14px; }
.logout-link{
  font-size:13px;
  color:var(--ink-soft);
  background:none;
  border:none;
  text-decoration:underline;
}

main{ max-width:820px; margin:0 auto; padding:20px 16px 60px; }

/* dashboard buttons */
.dash-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:8px;
}
@media (max-width:520px){ .dash-grid{ grid-template-columns:1fr; } }
.dash-btn{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 20px;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
}
.dash-btn .icon{ font-size:28px; }
.dash-btn .title{ font-size:17px; font-weight:700; color:var(--ink); }
.dash-btn .desc{ font-size:13px; color:var(--ink-soft); line-height:1.5; }
.badge{
  position:absolute;
  top:16px;
  right:16px;
  background:var(--margin);
  color:#fff;
  font-size:12px;
  font-weight:700;
  min-width:22px;
  height:22px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
}

/* list view */
.view-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.back-btn{
  background:none;
  border:none;
  color:var(--sky);
  font-size:14px;
  font-weight:600;
}
.view-header h2{ font-size:19px; margin:0; }

.list{ display:flex; flex-direction:column; gap:8px; }
.row-card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:12px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.row-card:hover{ border-color:var(--sky); }
.row-main{ min-width:0; }
.row-name{
  font-size:16px;
  font-weight:700;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.row-meta{
  font-size:11px;
  color:var(--ink-soft);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.row-course{
  font-size:11px;
  color:var(--sky);
  margin-top:2px;
}
.chip{
  font-size:10px;
  font-weight:700;
  padding:2px 7px;
  border-radius:8px;
  background:var(--paper);
  border:1px solid var(--paper-line);
  color:var(--ink-soft);
  flex-shrink:0;
}
.chip.locked{ background:#fbeaea; color:var(--margin); border-color:#f0cccc; }
.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--ink-soft);
  font-size:14px;
}

/* modal */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(30,42,71,0.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  padding:0;
}
.modal-overlay.open{ display:flex; }
@media (min-width:600px){
  .modal-overlay{ align-items:center; }
}
.modal-box{
  background:var(--card);
  width:100%;
  max-width:440px;
  max-height:88vh;
  overflow-y:auto;
  border-radius:18px 18px 0 0;
  padding:22px 20px 26px;
  position:relative;
}
@media (min-width:600px){
  .modal-box{ border-radius:16px; }
}
.modal-box h3{ margin:0 0 4px; font-size:19px; }
.modal-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 18px; }
.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
  margin-bottom:18px;
}
.info-item .k{ font-size:11px; color:var(--ink-soft); }
.info-item .v{ font-size:14px; color:var(--ink); font-weight:600; margin-top:2px; word-break:break-word; }
.modal-actions{ display:flex; gap:10px; margin-top:10px; }
.close-x{
  position:absolute;
  top:14px; right:16px;
  background:none; border:none;
  font-size:20px; color:var(--ink-soft);
}

.spinner-wrap{ text-align:center; padding:40px; color:var(--ink-soft); font-size:14px; }
.toast{
  position:fixed;
  bottom:20px; left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:12px 20px;
  border-radius:10px;
  font-size:13px;
  z-index:200;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.toast.show{ opacity:1; }
</style>
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <p class="brand">VISION Academics</p>
    <p class="sub">অ্যাডমিন প্যানেল — শুধু অনুমোদিত অ্যাডমিনদের জন্য</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginMobile">মোবাইল নম্বর</label>
        <input type="text" id="loginMobile" inputmode="numeric" placeholder="01XXXXXXXXX" required>
      </div>
      <div class="field">
        <label for="loginPassword">পাসওয়ার্ড</label>
        <input type="password" id="loginPassword" required>
      </div>
      <p class="error-text" id="loginError"></p>
      <button type="submit" class="btn" id="loginBtn">লগইন করুন</button>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <span class="brand">VISION অ্যাডমিন</span>
    <div class="topbar-right">
      <span class="welcome" id="welcomeText"></span>
      <button class="logout-link" id="logoutBtn">লগ-আউট</button>
    </div>
  </div>

  <main>
    <!-- DASHBOARD -->
    <div id="dashboardView">
      <div class="dash-grid">
        <button class="dash-btn" id="openPendingBtn">
          <span class="icon">⏳</span>
          <span class="title">পেন্ডিং রিকুয়েস্ট</span>
          <span class="desc">নতুন এনরোলমেন্ট রিকুয়েস্ট — অ্যাপ্রুভ বা বাতিল করুন</span>
          <span class="badge" id="pendingBadge" style="display:none;">0</span>
        </button>
        <button class="dash-btn" id="openInquiryBtn">
          <span class="icon">🎓</span>
          <span class="title">স্টুডেন্ট ইনকোয়ারি</span>
          <span class="desc">অ্যাক্টিভ স্টুডেন্টদের লিস্ট — কোর্স লক/আনলক করুন</span>
          <span class="badge" id="inquiryBadge" style="display:none;">0</span>
        </button>
      </div>
    </div>

    <!-- PENDING REQUESTS -->
    <div id="pendingView" style="display:none;">
      <div class="view-header">
        <button class="back-btn" data-back>← ফিরে যান</button>
        <h2>পেন্ডিং রিকুয়েস্ট</h2>
      </div>
      <div class="list" id="pendingList"></div>
    </div>

    <!-- STUDENT INQUIRY -->
    <div id="inquiryView" style="display:none;">
      <div class="view-header">
        <button class="back-btn" data-back>← ফিরে যান</button>
        <h2>স্টুডেন্ট ইনকোয়ারি</h2>
      </div>
      <div class="list" id="inquiryList"></div>
    </div>
  </main>
</div>

<!-- ================= APPROVE MODAL (pending) ================= -->
<div class="modal-overlay" id="approveModal">
  <div class="modal-box">
    <button class="close-x" data-close="approveModal">✕</button>
    <h3 id="apName">—</h3>
    <p class="modal-sub" id="apCourse">—</p>
    <div class="info-grid" id="apInfoGrid"></div>
    <label class="field" style="margin-bottom:0;">
      <span style="font-size:13px; color:var(--ink-soft); display:block; margin-bottom:6px;">পেমেন্ট (টাকা)</span>
      <input type="text" id="apPayment" placeholder="যেমন: ৫০০">
    </label>
    <p class="error-text" id="apError"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="apDeclineBtn">বাতিল</button>
      <button class="btn btn-green" id="apApproveBtn">কোর্স একটিভ করুন</button>
    </div>
  </div>
</div>

<!-- ================= STUDENT DETAIL MODAL (inquiry) ================= -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="close-x" data-close="detailModal">✕</button>
    <h3 id="dtName">—</h3>
    <p class="modal-sub" id="dtCourse">—</p>
    <div class="info-grid" id="dtInfoGrid"></div>
    <p class="error-text" id="dtError"></p>
    <div class="modal-actions">
      <button class="btn" id="dtLockBtn">লক করুন</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FORM_ENDPOINT = "https://late-forest-4748.dreamsicreation.workers.dev";

let currentAdmin = null; // { name, mobile }
let pendingData = [];
let inquiryData = [];
let activePendingId = null;
let activeInquiryId = null;

const ADMIN_SESSION_KEY = 'vision_admin_session';

function enterApp(admin){
  currentAdmin = admin;
  document.getElementById('welcomeText').textContent = 'স্বাগতম, ' + currentAdmin.name;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadCounts();
}

// আগে থেকে সেভ করা সেশন থাকলে সরাসরি লগইন স্ক্রিন স্কিপ করে অ্যাপে ঢুকিয়ে দেয়
(function restoreSession(){
  try{
    const saved = localStorage.getItem(ADMIN_SESSION_KEY);
    if(saved){
      const admin = JSON.parse(saved);
      if(admin && admin.mobile){ enterApp(admin); }
    }
  } catch(err){ /* corrupted/blocked storage — ignore, show login normally */ }
})();

/* ---------------- helpers ---------------- */
function post(payload){
  return fetch(FORM_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(r => r.json());
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});

function showView(view){
  ['dashboardView','pendingView','inquiryView'].forEach(v => {
    document.getElementById(v).style.display = (v === view) ? '' : 'none';
  });
}
document.querySelectorAll('[data-back]').forEach(btn => {
  btn.addEventListener('click', () => showView('dashboardView'));
});

/* ---------------- login ---------------- */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mobile = document.getElementById('loginMobile').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'যাচাই করা হচ্ছে...';

  try{
    const res = await post({ action:'admin_login', mobile, password });
    if(res.status === 'ok'){
      try{ localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(res.data)); } catch(err){ /* storage unavailable — session just won't persist */ }
      enterApp(res.data);
    } else {
      errEl.textContent = res.message || 'লগইন ব্যর্থ হয়েছে।';
    }
  } catch(err){
    errEl.textContent = 'সার্ভারে সমস্যা হয়েছে, আবার চেষ্টা করুন।';
  } finally {
    btn.disabled = false;
    btn.textContent = 'লগইন করুন';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  currentAdmin = null;
  try{ localStorage.removeItem(ADMIN_SESSION_KEY); } catch(err){ /* storage unavailable */ }
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginForm').reset();
  showView('dashboardView');
});

/* ---------------- counts on dashboard ---------------- */
async function loadCounts(){
  try{
    const [p, i] = await Promise.all([
      post({ action:'get_pending_requests' }),
      post({ action:'get_enrolled_students' })
    ]);
    if(p.status === 'ok'){
      pendingData = p.data;
      updateBadge('pendingBadge', pendingData.length);
    }
    if(i.status === 'ok'){
      inquiryData = i.data;
      updateBadge('inquiryBadge', inquiryData.length);
    }
  } catch(err){ /* silent — counts are non-critical */ }
}
function updateBadge(id, count){
  const el = document.getElementById(id);
  if(count > 0){ el.style.display = 'flex'; el.textContent = count; }
  else { el.style.display = 'none'; }
}

/* ---------------- pending requests ---------------- */
document.getElementById('openPendingBtn').addEventListener('click', async () => {
  showView('pendingView');
  await fetchPending();
});

async function fetchPending(){
  const list = document.getElementById('pendingList');
  list.innerHTML = '<div class="spinner-wrap">লোড হচ্ছে...</div>';
  try{
    const res = await post({ action:'get_pending_requests' });
    if(res.status !== 'ok'){ list.innerHTML = '<div class="empty-state">লোড করা যায়নি।</div>'; return; }
    pendingData = res.data;
    updateBadge('pendingBadge', pendingData.length);
    renderPendingList();
  } catch(err){
    list.innerHTML = '<div class="empty-state">সার্ভারে সমস্যা হয়েছে।</div>';
  }
}

function renderPendingList(){
  const list = document.getElementById('pendingList');
  if(!pendingData.length){
    list.innerHTML = '<div class="empty-state">কোনো পেন্ডিং রিকুয়েস্ট নেই।</div>';
    return;
  }
  list.innerHTML = pendingData.map(r => `
    <div class="row-card" data-id="${r.id}" data-role="pending-row">
      <div class="row-main">
        <div class="row-name">${escapeHtml(r.name || 'নাম নেই')}</div>
        <div class="row-meta">${escapeHtml(r.year)} ${escapeHtml(r.department)} · ${escapeHtml(r.mobile)}</div>
        <div class="row-course">${escapeHtml(r.course)}${r.nuDcu ? ' · ' + escapeHtml(r.nuDcu) : ''}</div>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-role="pending-row"]').forEach(el => {
    el.addEventListener('click', () => openApproveModal(Number(el.dataset.id)));
  });
}

function openApproveModal(id){
  const r = pendingData.find(x => x.id === id);
  if(!r) return;
  activePendingId = id;
  document.getElementById('apName').textContent = r.name || 'নাম নেই';
  document.getElementById('apCourse').textContent = r.course + (r.nuDcu ? ' · ' + r.nuDcu : '');
  document.getElementById('apInfoGrid').innerHTML = infoGrid([
    ['মোবাইল', r.mobile], ['লেভেল', r.level], ['ইয়ার', r.year],
    ['ডিপার্টমেন্ট', r.department], ['ইনস্টিটিউট', r.institute],
    ['ইমেইল', r.email], ['ঠিকানা', r.address], ['এনরোলড', r.enrolledAt]
  ]);
  document.getElementById('apPayment').value = '';
  document.getElementById('apError').textContent = '';
  openModal('approveModal');
}

document.getElementById('apApproveBtn').addEventListener('click', async () => {
  const payment = document.getElementById('apPayment').value.trim();
  const errEl = document.getElementById('apError');
  const btn = document.getElementById('apApproveBtn');

  if(!payment){ errEl.textContent = 'পেমেন্ট এমাউন্ট লিখুন।'; return; }

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'একটিভ করা হচ্ছে...';

  try{
    const res = await post({
      action:'approve_enrollment',
      id: activePendingId,
      adminName: currentAdmin.name,
      payment
    });
    if(res.status === 'ok'){
      closeModal('approveModal');
      showToast('কোর্স একটিভ করা হয়েছে।');
      await fetchPending();
      loadCounts();
    } else {
      errEl.textContent = res.message || 'কিছু একটা সমস্যা হয়েছে।';
    }
  } catch(err){
    errEl.textContent = 'সার্ভারে সমস্যা হয়েছে।';
  } finally {
    btn.disabled = false;
    btn.textContent = 'কোর্স একটিভ করুন';
  }
});

// decline = শুধু মোডাল বন্ধ করা, রো pending অবস্থাতেই থেকে যাবে
document.getElementById('apDeclineBtn').addEventListener('click', () => {
  closeModal('approveModal');
});

/* ---------------- student inquiry ---------------- */
document.getElementById('openInquiryBtn').addEventListener('click', async () => {
  showView('inquiryView');
  await fetchInquiry();
});

async function fetchInquiry(){
  const list = document.getElementById('inquiryList');
  list.innerHTML = '<div class="spinner-wrap">লোড হচ্ছে...</div>';
  try{
    const res = await post({ action:'get_enrolled_students' });
    if(res.status !== 'ok'){ list.innerHTML = '<div class="empty-state">লোড করা যায়নি।</div>'; return; }
    inquiryData = res.data;
    updateBadge('inquiryBadge', inquiryData.length);
    renderInquiryList();
  } catch(err){
    list.innerHTML = '<div class="empty-state">সার্ভারে সমস্যা হয়েছে।</div>';
  }
}

function renderInquiryList(){
  const list = document.getElementById('inquiryList');
  if(!inquiryData.length){
    list.innerHTML = '<div class="empty-state">কোনো অ্যাক্টিভ স্টুডেন্ট নেই।</div>';
    return;
  }
  list.innerHTML = inquiryData.map(r => `
    <div class="row-card" data-id="${r.id}" data-role="inquiry-row">
      <div class="row-main">
        <div class="row-name">${escapeHtml(r.name || 'নাম নেই')}</div>
        <div class="row-meta">${escapeHtml(r.year)} ${escapeHtml(r.department)} · ${escapeHtml(r.mobile)}</div>
        <div class="row-course">${escapeHtml(r.course)}${r.nuDcu ? ' · ' + escapeHtml(r.nuDcu) : ''}</div>
      </div>
      <span class="chip ${r.locked ? 'locked' : ''}">${r.locked ? 'লকড' : 'অ্যাক্টিভ'}</span>
    </div>
  `).join('');
  list.querySelectorAll('[data-role="inquiry-row"]').forEach(el => {
    el.addEventListener('click', () => openDetailModal(Number(el.dataset.id)));
  });
}

function openDetailModal(id){
  const r = inquiryData.find(x => x.id === id);
  if(!r) return;
  activeInquiryId = id;
  document.getElementById('dtName').textContent = r.name || 'নাম নেই';
  document.getElementById('dtCourse').textContent = r.course + (r.nuDcu ? ' · ' + r.nuDcu : '');
  document.getElementById('dtInfoGrid').innerHTML = infoGrid([
    ['মোবাইল', r.mobile], ['লেভেল', r.level], ['ইয়ার', r.year],
    ['ডিপার্টমেন্ট', r.department], ['ইনস্টিটিউট', r.institute],
    ['ইমেইল', r.email], ['ঠিকানা', r.address],
    ['এনরোলড', r.enrolledAt], ['মেয়াদ শেষ', r.expiresAt],
    ['পেমেন্ট', r.payment || '—'], ['অ্যাপ্রুভড বাই', r.admin || '—']
  ]);
  const lockBtn = document.getElementById('dtLockBtn');
  lockBtn.textContent = r.locked ? 'আনলক করুন' : 'লক করুন';
  lockBtn.className = 'btn ' + (r.locked ? 'btn-green' : 'btn-danger');
  document.getElementById('dtError').textContent = '';
  openModal('detailModal');
}

document.getElementById('dtLockBtn').addEventListener('click', async () => {
  const r = inquiryData.find(x => x.id === activeInquiryId);
  if(!r) return;
  const errEl = document.getElementById('dtError');
  const btn = document.getElementById('dtLockBtn');
  const newLocked = !r.locked;

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'হচ্ছে...';

  try{
    const res = await post({ action:'set_course_lock', id: activeInquiryId, locked: newLocked });
    if(res.status === 'ok'){
      closeModal('detailModal');
      showToast(newLocked ? 'কোর্স লক করা হয়েছে।' : 'কোর্স আনলক করা হয়েছে।');
      await fetchInquiry();
    } else {
      errEl.textContent = res.message || 'কিছু একটা সমস্যা হয়েছে।';
      btn.disabled = false;
      btn.textContent = r.locked ? 'আনলক করুন' : 'লক করুন';
    }
  } catch(err){
    errEl.textContent = 'সার্ভারে সমস্যা হয়েছে।';
    btn.disabled = false;
    btn.textContent = r.locked ? 'আনলক করুন' : 'লক করুন';
  }
});

/* ---------------- shared UI helpers ---------------- */
function infoGrid(pairs){
  return pairs
    .filter(([,v]) => v !== undefined)
    .map(([k,v]) => `
      <div class="info-item">
        <div class="k">${escapeHtml(k)}</div>
        <div class="v">${escapeHtml(v || '—')}</div>
      </div>
    `).join('');
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}
</script>
